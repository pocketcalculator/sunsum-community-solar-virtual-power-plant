name: Prepare Azure2 deployment
description: Check Azure deployment prerequisites and create an ephemeral parameters file.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        PARAMETERS_FILE="$RUNNER_TEMP/deployment-parameters.json"
        echo "PARAMETERS_FILE=$PARAMETERS_FILE" >> "$GITHUB_ENV"
        "$GITHUB_WORKSPACE/infrastructure/scripts/Prepare-Azure2Deployment.sh" "$PARAMETERS_FILE"
