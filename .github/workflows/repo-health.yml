name: Repository health

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ACCEPTANCE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: repo-health-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-files:
    name: Repository files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.18.1 "**/*.md" "#node_modules"

      - name: Validate YAML and JSON formatting
        run: npx --yes prettier@3.6.2 --check "**/*.{json,yml,yaml}"

  bicep-templates:
    name: Bicep templates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify pinned Bicep compiler
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/Azure/bicep/releases/download/v0.42.1/bicep-linux-x64 \
            --output "$RUNNER_TEMP/bicep"
          printf '%s  %s\n' aed90eb2c69a6ee2bd70dc0d4354408ac4d04fd9911d3ec8e0cd74ad173e7139 "$RUNNER_TEMP/bicep" | sha256sum --check -
          chmod +x "$RUNNER_TEMP/bicep"
          "$RUNNER_TEMP/bicep" --version

      - name: Compile every template without Azure credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/compiled-bicep"
          shopt -s globstar
          for template in infrastructure/templates/**/*.bicep; do
            relative="${template#infrastructure/templates/}"
            mkdir -p "$RUNNER_TEMP/compiled-bicep/$(dirname "$relative")"
            "$RUNNER_TEMP/bicep" build "$template" --no-restore \
              --outfile "$RUNNER_TEMP/compiled-bicep/${relative%.bicep}.json"
          done
          "$RUNNER_TEMP/bicep" build-params infrastructure/templates/resources.dev.bicepparam \
            --bicep-file infrastructure/templates/resources.bicep --no-restore \
            --outfile "$RUNNER_TEMP/compiled-bicep/resources.dev.parameters.json"

      - name: Evaluate firewall template input guards without Azure
        shell: pwsh
        run: |
          & ./infrastructure/scripts/tests/firewall-template.test.ps1 -BicepPath "$env:RUNNER_TEMP/bicep"

      - name: Validate deployment and runtime role guards without Azure
        shell: pwsh
        run: |
          & ./infrastructure/scripts/tests/deployment-safety.test.ps1 -BicepPath "$env:RUNNER_TEMP/bicep"

      - name: Validate access and Blob identity guards without Azure
        shell: pwsh
        run: |
          & ./infrastructure/scripts/tests/mvp-access.test.ps1 -BicepPath "$env:RUNNER_TEMP/bicep"

  node-project:
    name: Node project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.ACCEPTANCE_SOURCE_SHA }}

      - name: Require the root application and lockfile
        shell: bash
        run: test -f package.json && test -f package-lock.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run lint script
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Run build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  browser-smoke:
    name: Public shell browser smoke
    needs: node-project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.ACCEPTANCE_SOURCE_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build the production application
        run: npm run build

      - name: Exercise public routes at desktop, tablet, and mobile sizes
        id: public-browser
        run: npm run test:e2e

      - name: Retain public header images without browser traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sunsum-public-header-images-${{ env.ACCEPTANCE_SOURCE_SHA }}
          path: test-results/**/compact-workspace-role-theme.png
          if-no-files-found: warn

      - name: Exercise mocked role-scoped read contracts
        if: success() || (failure() && steps.public-browser.outcome == 'failure')
        run: npm run test:e2e -- --config=playwright.connected.config.ts --workers=1

  server-demo-smoke:
    name: Isolated mock-backed server demo
    needs: node-project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.ACCEPTANCE_SOURCE_SHA }}

      - name: Set up the supported Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install the existing browser runner
        run: npx playwright install --with-deps chromium

      - name: Build the production application
        run: npm run build

      - name: Exercise isolated fictional sessions and interest
        run: npm run test:e2e -- --config=tests/e2e-server-demo/playwright.config.ts --workers=1 --retries=0 --max-failures=1

      - name: Retain failed fictional workspace diagnostics without session traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sunsum-server-demo-diagnostics-${{ env.ACCEPTANCE_SOURCE_SHA }}
          path: |
            test-results/server-demo/**/error-context.md
            test-results/server-demo/**/test-failed-*.png
          if-no-files-found: warn

  synthetic-demo-release:
    name: Synthetic demo and source package
    needs: node-project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUNSUM_PUBLIC_DATA_MODE: preview
      SUNSUM_PUBLIC_API_BASE_URL: ""
      PLAYWRIGHT_HOSTING_PATH: /sunsum-ui-demo/
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.ACCEPTANCE_SOURCE_SHA }}

      - name: Require the exact acceptance source revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$ACCEPTANCE_SOURCE_SHA"

      - name: Set up the supported Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build the synthetic-only artifact
        run: npm run build:demo

      - name: Install the existing browser runner
        run: npx playwright install --with-deps chromium

      - name: Exercise the actual Pages prefix
        run: npm run test:e2e -- --config=playwright.vibehub.config.ts --workers=1

      - name: Retain synthetic landing and header images
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sunsum-ui-images-${{ env.ACCEPTANCE_SOURCE_SHA }}
          path: |
            test-results/**/public-front-door-*.png
            test-results/**/compact-synthetic-header-*.png
            test-results/**/shared-pill-glide-settled.png
          if-no-files-found: warn

      - name: Package source and demo without Azure
        shell: pwsh
        run: |
          & ./scripts/New-UiRelease.ps1 -OutputDirectory .azure/artifacts/ui-release

      - name: Bind both artifacts and the demo stamp to the accepted source
        shell: pwsh
        run: |
          $directory = '.azure/artifacts/ui-release'
          $release = Get-Content -LiteralPath "$directory/release-manifest.json" -Raw | ConvertFrom-Json
          $stamp = Get-Content -LiteralPath 'build/vibehub/demo-build.json' -Raw | ConvertFrom-Json
          if ($release.sourceRevision -cne $env:ACCEPTANCE_SOURCE_SHA -or
              $stamp.sourceRevision -cne $env:ACCEPTANCE_SOURCE_SHA -or -not $stamp.sourceClean) {
            throw 'Artifacts do not match the exact acceptance source.'
          }
          foreach ($artifact in @($release.application, $release.demo)) {
            $hash = (Get-FileHash -LiteralPath (Join-Path $directory $artifact.file) -Algorithm SHA256).Hash
            if ($hash -ine $artifact.sha256) { throw 'Artifact hash does not match the release manifest.' }
          }

      - name: Build the actual packaged application source
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'sunsum-packaged-source'
          Expand-Archive -LiteralPath .azure/artifacts/ui-release/sunsum-app-source.zip -DestinationPath $source
          Push-Location $source
          try {
            npm ci --include=dev
            if ($LASTEXITCODE -ne 0) { throw 'Packaged dependency restoration failed.' }
            npm run build
            if ($LASTEXITCODE -ne 0) { throw 'Packaged application build failed.' }
          } finally {
            Pop-Location
          }
          $directory = '.azure/artifacts/ui-release'
          $release = Get-Content -LiteralPath "$directory/release-manifest.json" -Raw | ConvertFrom-Json
          @{
            sourceRevision = $env:ACCEPTANCE_SOURCE_SHA
            eventRevision = $env:GITHUB_SHA
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            backendContractRevision = $release.backendContractRevision
            applicationSHA256 = $release.application.sha256
            demoSHA256 = $release.demo.sha256
            manifestSHA256 = (Get-FileHash -LiteralPath "$directory/release-manifest.json" -Algorithm SHA256).Hash
            packagedSourceBuild = 'succeeded'
          } | ConvertTo-Json | Set-Content -LiteralPath "$directory/ci-acceptance.json" -Encoding utf8

      - name: Retain reviewed handoff artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sunsum-ui-release-${{ env.ACCEPTANCE_SOURCE_SHA }}
          path: .azure/artifacts/ui-release/
          include-hidden-files: false
          if-no-files-found: error
