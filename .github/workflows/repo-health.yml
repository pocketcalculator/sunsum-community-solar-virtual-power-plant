name: Repository health

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-health-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-files:
    name: Repository files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.18.1 "**/*.md" "#node_modules"

      - name: Validate YAML and JSON formatting
        run: npx --yes prettier@3.6.2 --check "**/*.{json,yml,yaml}"

  bicep-templates:
    name: Bicep templates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify pinned Bicep compiler
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/Azure/bicep/releases/download/v0.42.1/bicep-linux-x64 \
            --output "$RUNNER_TEMP/bicep"
          printf '%s  %s\n' aed90eb2c69a6ee2bd70dc0d4354408ac4d04fd9911d3ec8e0cd74ad173e7139 "$RUNNER_TEMP/bicep" | sha256sum --check -
          chmod +x "$RUNNER_TEMP/bicep"
          "$RUNNER_TEMP/bicep" --version

      - name: Compile every template without Azure credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/compiled-bicep"
          shopt -s globstar
          for template in infrastructure/templates/**/*.bicep; do
            relative="${template#infrastructure/templates/}"
            mkdir -p "$RUNNER_TEMP/compiled-bicep/$(dirname "$relative")"
            "$RUNNER_TEMP/bicep" build "$template" --no-restore \
              --outfile "$RUNNER_TEMP/compiled-bicep/${relative%.bicep}.json"
          done
          "$RUNNER_TEMP/bicep" build-params infrastructure/templates/resources.dev.bicepparam \
            --bicep-file infrastructure/templates/resources.bicep --no-restore \
            --outfile "$RUNNER_TEMP/compiled-bicep/resources.dev.parameters.json"

      - name: Evaluate firewall template input guards without Azure
        shell: pwsh
        run: |
          & ./infrastructure/scripts/tests/firewall-template.test.ps1 -BicepPath "$env:RUNNER_TEMP/bicep"

      - name: Validate deployment and runtime role guards without Azure
        shell: pwsh
        run: |
          & ./infrastructure/scripts/tests/deployment-safety.test.ps1 -BicepPath "$env:RUNNER_TEMP/bicep"

      - name: Validate access and Blob identity guards without Azure
        shell: pwsh
        run: |
          & ./infrastructure/scripts/tests/mvp-access.test.ps1 -BicepPath "$env:RUNNER_TEMP/bicep"

  node-project:
    name: Node project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require the root application and lockfile
        shell: bash
        run: test -f package.json && test -f package-lock.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run lint script
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Run build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  browser-smoke:
    name: Public shell browser smoke
    needs: node-project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build the production application
        run: npm run build

      - name: Exercise public routes at desktop, tablet, and mobile sizes
        run: npm run test:e2e
