name: Repository health

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-health-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-files:
    name: Repository files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.18.1 "**/*.md" "#node_modules"

      - name: Validate YAML and JSON formatting
        run: npx --yes prettier@3.6.2 --check "**/*.{json,yml,yaml}"

  node-project:
    name: Node project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect Node project
        id: node-project
        shell: bash
        run: echo "exists=$([[ -f package.json ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: ${{ steps.node-project.outputs.exists == 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: ${{ steps.node-project.outputs.exists == 'true' }}
        run: npm ci

      - name: Audit production dependencies
        if: ${{ steps.node-project.outputs.exists == 'true' }}
        run: npm audit --omit=dev --audit-level=high

      - name: Run lint script
        if: ${{ steps.node-project.outputs.exists == 'true' }}
        run: npm run lint

      - name: Run tests
        if: ${{ steps.node-project.outputs.exists == 'true' }}
        run: npm test

      - name: Run build
        if: ${{ steps.node-project.outputs.exists == 'true' }}
        run: npm run build
