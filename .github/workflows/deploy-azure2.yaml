name: Validate and Deploy SunSum Test Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - "infrastructure/templates/**"
      - "infrastructure/config/**"
      - "infrastructure/scripts/**"
      - ".github/workflows/deploy-azure2.yaml"
      - ".github/actions/check-infrastructure-providers/**"
      - ".github/actions/check-infrastructure-secrets/**"
      - ".github/actions/compose-infrastructure-parameters/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Serialize each complete validate-and-deploy run so a newly approved run cannot
# race an earlier approved run against the same resource group.
concurrency:
  group: deploy-azure2-${{ github.workflow }}
  cancel-in-progress: false

env:
  RESOURCE_GROUP_NAME: rg-sunsum-solar-dev-centralus
  TEMPLATE_FILE: infrastructure/templates/resources.bicep
  DEPLOYMENT_NAME: sunsum-test-${{ github.run_number }}

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check required secrets
        uses: ./.github/actions/check-infrastructure-secrets
        with:
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          postgres-admin-object-id: ${{ secrets.POSTGRES_ADMIN_OBJECT_ID }}
          postgres-admin-principal-name: ${{ secrets.POSTGRES_ADMIN_PRINCIPAL_NAME }}

      - name: Azure Login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build Bicep
        shell: bash
        run: |
          set -euo pipefail
          az bicep build --file "$TEMPLATE_FILE"

      - name: Compose deployment parameters
        uses: ./.github/actions/compose-infrastructure-parameters
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          postgres-admin-object-id: ${{ secrets.POSTGRES_ADMIN_OBJECT_ID }}
          postgres-admin-principal-name: ${{ secrets.POSTGRES_ADMIN_PRINCIPAL_NAME }}

      - name: Check required resource providers
        uses: ./.github/actions/check-infrastructure-providers

      - name: Validate deployment
        shell: bash
        run: |
          set -euo pipefail
          az deployment group validate \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --template-file "$TEMPLATE_FILE" \
            --parameters "@$PARAMETERS_FILE"

      - name: Show what-if
        shell: bash
        run: |
          set -euo pipefail
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --template-file "$TEMPLATE_FILE" \
            --parameters "@$PARAMETERS_FILE"

      - name: Remove composed parameters
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${PARAMETERS_FILE:-}"

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: azure-infrastructure

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check required secrets
        uses: ./.github/actions/check-infrastructure-secrets
        with:
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          postgres-admin-object-id: ${{ secrets.POSTGRES_ADMIN_OBJECT_ID }}
          postgres-admin-principal-name: ${{ secrets.POSTGRES_ADMIN_PRINCIPAL_NAME }}

      - name: Azure Login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Compose deployment parameters
        uses: ./.github/actions/compose-infrastructure-parameters
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          postgres-admin-object-id: ${{ secrets.POSTGRES_ADMIN_OBJECT_ID }}
          postgres-admin-principal-name: ${{ secrets.POSTGRES_ADMIN_PRINCIPAL_NAME }}

      - name: Check required resource providers
        uses: ./.github/actions/check-infrastructure-providers

      - name: Deploy test infrastructure
        shell: bash
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --name "$DEPLOYMENT_NAME" \
            --mode Incremental \
            --template-file "$TEMPLATE_FILE" \
            --parameters "@$PARAMETERS_FILE"

      - name: Report deployed resource locations
        shell: bash
        run: |
          set -euo pipefail
          outputs="$(az deployment group show \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --name "$DEPLOYMENT_NAME" \
            --query properties.outputs --output json)"
          echo "$outputs" | jq '.'
          subscription="$(az account show --query id --output tsv)"
          group_url="https://portal.azure.com/#@/resource/subscriptions/$subscription/resourceGroups/$RESOURCE_GROUP_NAME"
          {
            echo "### Deployed resources"
            echo ""
            echo "| Resource | Name | Portal |"
            echo "| --- | --- | --- |"
            while IFS='|' read -r label provider output_name; do
              value="$(echo "$outputs" | jq -r --arg key "$output_name" '.[$key].value // ""')"
              if [ -z "$value" ] || [ "$value" = "null" ]; then
                echo "| $label | not deployed | n/a |"
              else
                echo "| $label | \`$value\` | [$value]($group_url/providers/$provider/$value) |"
              fi
            done <<'RESOURCES'
          Log Analytics workspace|Microsoft.OperationalInsights/workspaces|AZURE_LOG_ANALYTICS_WORKSPACE_NAME
          Application Insights|Microsoft.Insights/components|AZURE_APPLICATION_INSIGHTS_NAME
          Virtual network|Microsoft.Network/virtualNetworks|AZURE_VIRTUAL_NETWORK_NAME
          Blob private endpoint|Microsoft.Network/privateEndpoints|AZURE_BLOB_PRIVATE_ENDPOINT_NAME
          Private DNS zone|Microsoft.Network/privateDnsZones|AZURE_BLOB_PRIVATE_DNS_ZONE_NAME
          RESOURCES
            echo ""
            echo "Private DNS virtual-network link: \`$(echo "$outputs" | jq -r '.AZURE_PRIVATE_DNS_ZONE_LINK_NAME.value // "not deployed"')\`"
            echo "Diagnostic setting on the web app and PostgreSQL server: \`$(echo "$outputs" | jq -r '.AZURE_DIAGNOSTIC_SETTING_NAME.value // "not deployed"')\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove composed parameters
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${PARAMETERS_FILE:-}"
