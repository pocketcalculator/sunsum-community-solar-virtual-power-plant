name: Deploy SunSum Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - "infrastructure/templates/**"
      - ".github/workflows/deploy-azure.yml"
  workflow_dispatch:
    inputs:
      parameters_sha256:
        description: "SHA-256 of the reviewed parameter file recorded in the approval"
        required: true
      approval_sha256:
        description: "SHA-256 of the reviewed approval record"
        required: true
      approval_reference:
        description: "Infrastructure review reference"
        required: true
      database_budget_approval:
        description: "Approved PostgreSQL budget reference"
        required: true
      storage_budget_approval:
        description: "Approved Storage budget reference"
        required: true

permissions:
  id-token: write
  contents: read

# Queue infrastructure runs so concurrent pushes cannot issue racing ARM
# operations against the same resource group.
concurrency:
  group: deploy-azure-${{ github.workflow }}
  cancel-in-progress: false

env:
  TEMPLATE_FILE: infrastructure/templates/resources.bicep

jobs:
  validate:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The reviewed parameter document and its digest are provisioned
      # out-of-band by an operator once a deployment is actually approved.
      # Pushes that touch the templates (including this workflow's own
      # first-time setup) must not hard-fail CI before that provisioning
      # happens, so this step reports readiness instead of exiting non-zero.
      - name: Check reviewed parameters availability
        id: params
        shell: bash
        env:
          PARAMETERS_JSON: ${{ secrets.AZURE_RESOURCES_PARAMETERS_JSON }}
          PARAMETERS_SHA256: ${{ github.event_name == 'workflow_dispatch' && inputs.parameters_sha256 || vars.AZURE_RESOURCES_PARAMETERS_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "$PARAMETERS_JSON" ] || [ -z "$PARAMETERS_SHA256" ]; then
            echo "::notice::AZURE_RESOURCES_PARAMETERS_JSON and/or AZURE_RESOURCES_PARAMETERS_SHA256 are not configured yet; skipping Azure validation until an operator provisions them."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      # The environment-specific parameter document is never committed; it is
      # supplied as a reviewed secret and bound to the reviewed digest.
      - name: Materialize reviewed parameter file
        if: steps.params.outputs.configured == 'true'
        shell: bash
        env:
          PARAMETERS_JSON: ${{ secrets.AZURE_RESOURCES_PARAMETERS_JSON }}
          PARAMETERS_SHA256: ${{ github.event_name == 'workflow_dispatch' && inputs.parameters_sha256 || vars.AZURE_RESOURCES_PARAMETERS_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          normalized_sha256="${PARAMETERS_SHA256,,}"
          if ! [[ "$normalized_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::AZURE_RESOURCES_PARAMETERS_SHA256/parameters_sha256 must be a 64-character hexadecimal SHA-256 digest." >&2
            exit 1
          fi
          printf '%s' "$PARAMETERS_JSON" > "$RUNNER_TEMP/resources.parameters.json"
          printf '%s  %s\n' "$normalized_sha256" "$RUNNER_TEMP/resources.parameters.json" | sha256sum --check -
          echo "PARAMETER_FILE=$RUNNER_TEMP/resources.parameters.json" >> "$GITHUB_ENV"

      - name: Azure Login
        if: steps.params.outputs.configured == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build Bicep
        if: steps.params.outputs.configured == 'true'
        run: |
          az bicep build \
            --file $TEMPLATE_FILE

      - name: Validate Deployment
        if: steps.params.outputs.configured == 'true'
        env:
          RESOURCE_GROUP_NAME: ${{ secrets.RESOURCE_GROUP_NAME }}
        run: |
          az deployment group validate \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --template-file "$TEMPLATE_FILE" \
            --parameters "@$PARAMETER_FILE"

      - name: What-If
        if: steps.params.outputs.configured == 'true'
        env:
          RESOURCE_GROUP_NAME: ${{ secrets.RESOURCE_GROUP_NAME }}
        run: |
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --template-file "$TEMPLATE_FILE" \
            --parameters "@$PARAMETER_FILE"

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate

    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: azure-infrastructure

    steps:
      - name: Block incompatible legacy provisioning
        shell: bash
        run: |
          echo "::error::Legacy provisioning is disabled: its first-time/F1 parameter contract is incompatible with the current B1 template. Use the reviewed Deploy-Infrastructure.ps1 flow or the separately authorized manual deploy-azure2.yaml workflow."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # An explicitly dispatched deployment must fail loudly rather than
      # silently skip the actual Azure steps when the reviewed artifacts are
      # missing; a green run here must mean infrastructure was provisioned.
      - name: Check reviewed deployment artifacts and digests
        id: deployment-artifacts
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PARAMETERS_JSON: ${{ secrets.AZURE_RESOURCES_PARAMETERS_JSON }}
          APPROVAL_JSON: ${{ secrets.AZURE_PROVISION_APPROVAL_JSON }}
          PARAMETERS_SHA256: ${{ inputs.parameters_sha256 }}
          APPROVAL_SHA256: ${{ inputs.approval_sha256 }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "::error::Deploy job requires workflow_dispatch so reviewed SHA-256 inputs are present."
            exit 1
          fi
          missing_artifacts=()
          if [ -z "${PARAMETERS_JSON:-}" ]; then
            missing_artifacts+=("AZURE_RESOURCES_PARAMETERS_JSON")
          fi
          if [ -z "${APPROVAL_JSON:-}" ]; then
            missing_artifacts+=("AZURE_PROVISION_APPROVAL_JSON")
          fi
          if [ "${#missing_artifacts[@]}" -gt 0 ]; then
            printf -v missing_artifacts_list '%s, ' "${missing_artifacts[@]}"
            missing_artifacts_list="${missing_artifacts_list%, }"
            echo "::error::Missing reviewed deployment artifact secrets: $missing_artifacts_list. Provision these secrets before dispatching an Azure deployment."
            exit 1
          fi
          sha256_pattern='^[a-fA-F0-9]{64}$'
          validate_reviewed_digest() {
            local input_name="$1"
            local secret_name="$2"
            local secret_value="$3"
            local supplied_sha256="$4"
            local actual_sha256
            if [[ ! "$supplied_sha256" =~ $sha256_pattern ]]; then
              echo "::error::$input_name must be the 64-character hexadecimal SHA-256 digest of $secret_name, not an approval reference or label."
              return 1
            fi
            actual_sha256="$(printf '%s' "$secret_value" | sha256sum | awk '{print $1}')"
            if [ "${supplied_sha256,,}" != "${actual_sha256,,}" ]; then
              echo "::error::$input_name does not match $secret_name. Recompute with printf '%s' \"<exact $secret_name secret value>\" | sha256sum so no newline is appended."
              return 1
            fi
            return 0
          }
          validation_failed=false
          validate_reviewed_digest parameters_sha256 AZURE_RESOURCES_PARAMETERS_JSON "$PARAMETERS_JSON" "${PARAMETERS_SHA256:-}" || validation_failed=true
          validate_reviewed_digest approval_sha256 AZURE_PROVISION_APPROVAL_JSON "$APPROVAL_JSON" "${APPROVAL_SHA256:-}" || validation_failed=true
          if [ "$validation_failed" = true ]; then
            exit 1
          fi
          # These guards are redundant while this preflight hard-fails, but keep
          # every Azure-writing step fail-closed if failure handling changes later.
          echo "configured=true" >> "$GITHUB_OUTPUT"

      # Both reviewed artifacts are supplied as secrets and verified against the
      # digests recorded in the infrastructure review before any Azure write.
      - name: Materialize reviewed parameter and approval records
        if: steps.deployment-artifacts.outputs.configured == 'true'
        shell: bash
        env:
          PARAMETERS_JSON: ${{ secrets.AZURE_RESOURCES_PARAMETERS_JSON }}
          APPROVAL_JSON: ${{ secrets.AZURE_PROVISION_APPROVAL_JSON }}
          PARAMETERS_SHA256: ${{ inputs.parameters_sha256 }}
          APPROVAL_SHA256: ${{ inputs.approval_sha256 }}
        run: |
          set -euo pipefail
          if [ -z "$PARAMETERS_JSON" ] || [ -z "$APPROVAL_JSON" ]; then
            echo "AZURE_RESOURCES_PARAMETERS_JSON and AZURE_PROVISION_APPROVAL_JSON are required." >&2
            exit 1
          fi
          umask 077
          normalized_parameters_sha256="${PARAMETERS_SHA256,,}"
          normalized_approval_sha256="${APPROVAL_SHA256,,}"
          if ! [[ "$normalized_parameters_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::parameters_sha256 must be a 64-character hexadecimal SHA-256 digest." >&2
            exit 1
          fi
          if ! [[ "$normalized_approval_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::approval_sha256 must be a 64-character hexadecimal SHA-256 digest." >&2
            exit 1
          fi
          printf '%s' "$PARAMETERS_JSON" > "$RUNNER_TEMP/resources.parameters.json"
          printf '%s' "$APPROVAL_JSON" > "$RUNNER_TEMP/provision-approval.json"
          printf '%s  %s\n' "$normalized_parameters_sha256" "$RUNNER_TEMP/resources.parameters.json" | sha256sum --check -
          printf '%s  %s\n' "$normalized_approval_sha256" "$RUNNER_TEMP/provision-approval.json" | sha256sum --check -
          echo "PARAMETER_FILE=$RUNNER_TEMP/resources.parameters.json" >> "$GITHUB_ENV"
          echo "APPROVAL_FILE=$RUNNER_TEMP/provision-approval.json" >> "$GITHUB_ENV"

      - name: Azure Login
        if: steps.deployment-artifacts.outputs.configured == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Provision Infrastructure
        if: steps.deployment-artifacts.outputs.configured == 'true'
        shell: pwsh
        env:
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP_NAME: ${{ secrets.RESOURCE_GROUP_NAME }}
          PARAMETERS_SHA256: ${{ inputs.parameters_sha256 }}
          APPROVAL_SHA256: ${{ inputs.approval_sha256 }}
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
          DATABASE_BUDGET_APPROVAL: ${{ inputs.database_budget_approval }}
          STORAGE_BUDGET_APPROVAL: ${{ inputs.storage_budget_approval }}
        run: |
          ./infrastructure/scripts/Provision-Infrastructure.ps1 `
            -SubscriptionId $env:SUBSCRIPTION_ID `
            -ResourceGroupName $env:RESOURCE_GROUP_NAME `
            -ParametersPath $env:PARAMETER_FILE `
            -ExpectedSha256 $env:PARAMETERS_SHA256 `
            -ApprovalPath $env:APPROVAL_FILE `
            -ApprovalSha256 $env:APPROVAL_SHA256 `
            -ApprovalReference $env:APPROVAL_REFERENCE `
            -DatabaseBudgetApproval $env:DATABASE_BUDGET_APPROVAL `
            -StorageBudgetApproval $env:STORAGE_BUDGET_APPROVAL `
            -Apply
