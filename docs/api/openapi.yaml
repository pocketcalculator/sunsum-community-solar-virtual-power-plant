openapi: 3.0.3
info:
  title: SunSum API (MVP)
  version: 0.1.0
  description: >-
    Agreed backend contract derived from sections 5-10 of
    `docs/sunsum_technical_design_doc.md`. It covers site draft/submission,
    the site-owner dashboard, the operator queue and decisions, adjacent project
    stage changes, investor visibility, investor interest, operator engagement
    review, the tier-1 deal room, and the existing tier-0 portfolio.

    Wire fields use snake_case. Path parameters identify the resource being acted
    on, request bodies carry mutations, and query parameters filter collections.
    Unknown input is rejected. Optional objects are omitted; nullable scalar values
    use null. The viability engine remains a separate server-to-server service.

    **Authentication:** every operation except `POST /auth/demo-switch` and
    `POST /auth/logout` resolves its caller from the signed `sunsum_session`
    cookie and answers 401 when there is none. Those two are how a session
    starts and ends, so requiring one would be circular. The role is read
    from the user record on each request rather than from the token, so a caller
    cannot select their own role through a header, cookie, query parameter, or
    request body, and a role changed in the database takes effect on the next
    request. Cookies are `HttpOnly`, `SameSite=Lax`, and `Secure` in production.
    `SameSite=Lax` is not on its own a CSRF defence — it is scoped to the site,
    not the origin, so a sibling origin's forged write still carries the cookie.
    Every state-changing operation is additionally checked against
    `Sec-Fetch-Site`, falling back to `Origin`, and answers 403 when the request
    came from a browsing context that is not ours.

    How a session *starts* is not authentication. `POST /auth/demo-switch` hands
    out one of three seeded identities so the three roles can be demonstrated
    without an identity provider, and verifies no credential. It is opt-in per
    deployment and is the single endpoint a real identity provider replaces.

    Resolving a session needs a signing secret, and the two ways to get that
    wrong fail differently. A *configured* `SUNSUM_SESSION_SECRET` shorter than
    32 characters is refused in every environment. An *unset* one is refused
    only in production — outside it the server invents a per-process secret and
    warns, so local development needs no configuration and sessions simply end
    when the process does. Either refusal answers 503 with
    `code: service_unavailable` rather than 401 on every operation that needs a
    caller: the caller is not at fault and signing in again will not help.

    A production deployment missing its secret still starts and still serves
    everything that needs no caller. The refusal happens per request, when the
    secret is first needed, not at boot.
  contact:
    name: Workstream 2 — Backend & Workflow
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: /api
    description: Next.js server endpoints (§3 — "Next.js/Node.js server endpoints")
security:
  - sessionCookie: []
tags:
  - name: Identity
    description: Session sign-in, sign-out, and the current caller
  - name: Sites
    description: S-SITE — draft save, missing-field computation, submission lifecycle
  - name: Submissions
    description: S-SITE — operator queue and decisions
  - name: Projects
    description: S-PROJ — project creation, stage transitions, assignment, visibility
  - name: Portfolio
    description: S-INV — investor profiles, mandate capture, portfolio matching
  - name: Engagements
    description: S-ENG and S-VIEW — interest, operator review, and deal-room disclosure
  - name: Participants
    description: The `/join` sign-up form, before a participant has any role
  - name: Export
    description: Composed download of whatever the caller can already see
paths:
  /auth/demo-switch:
    post:
      tags: [Identity]
      operationId: demoSwitch
      security: []
      summary: Sign in as one of the three seeded demo identities
      description: |
        Not a credential check. Hands out a session for a **seeded** account so
        the three roles can be demonstrated without an identity provider, which
        means anyone who can reach it can become any of those three users. It is
        therefore opt-in per deployment; where it is off, it answers 404 so the
        endpoint's existence is not advertised. This is the one operation a real
        identity provider replaces.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              additionalProperties: false
              properties:
                role:
                  type: string
                  enum: [site_owner, operator, investor]
      responses:
        "200":
          description: Signed in; the session cookie is set on the response.
          headers:
            Set-Cookie:
              description: The `sunsum_session` cookie.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identity" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/CrossSiteRefused" }
        "404":
          description: Demo sign-in is not enabled on this deployment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description:
            The demo accounts are unusable — absent from this database, or
            holding a role other than the one requested — or the session secret
            is missing or too short. No cookie is issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /auth/logout:
    post:
      tags: [Identity]
      operationId: logout
      security: []
      summary: Sign out
      description: Clears the session cookie. Safe to call without a session.
      responses:
        "200":
          description: Signed out; the session cookie is expired on the response.
          headers:
            Set-Cookie:
              description: The cleared `sunsum_session` cookie.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [signed_out]
                properties:
                  signed_out: { type: boolean, enum: [true] }
        "403": { $ref: "#/components/responses/CrossSiteRefused" }
  /profiles:
    post:
      tags: [Participants]
      operationId: createParticipantProfile
      security: []
      summary: Store a completed sign-up form
      description: |
        The `/join` form. Open by design: the caller has no account yet, which
        is the whole point of the endpoint. It therefore checks
        `Sec-Fetch-Site`, falling back to `Origin`, instead of inheriting that
        check from an identity step.

        What it writes is a pre-account record. Nothing in it is verified,
        nothing reads it to make an authorization decision, and it grants no
        access to anything.

        **No credential is accepted.** There is no `password` property, and
        sending one is a `400` rather than a field the server quietly ignores.

        `role_id` is derived from `user_type_id` and cannot be supplied, so a
        request cannot claim a workspace its user type does not map to. It is
        `null` for the user types that map to no workspace, which is an answer
        rather than a missing value.

        Submissions are appended, never merged. Two sign-ups from the same
        email address produce two records: the address is unverified, so
        letting it decide which record is overwritten would let anyone displace
        a stranger's submission.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ParticipantProfileRequest" }
      responses:
        "201":
          description: The stored profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParticipantProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/CrossSiteRefused" }
        "422":
          description: Consent was explicitly refused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
    get:
      tags: [Participants]
      operationId: listParticipantProfiles
      summary: Operator read of the sign-up list
      description: |
        Operator-only. The write half of this path is open to the world, so the
        read half is where the role check lives: these rows are names, email
        addresses and stated intentions that nobody has verified, collected
        from people who have no account and cannot come back and read them
        themselves.

        Returned newest first. The page is taken from the most recent end, so
        a capped read shows today's sign-ups rather than the oldest rows.
      parameters:
        - name: limit
          in: query
          required: false
          description: >-
            How many of the most recent profiles to return. Written as digits;
            `1e3` and similar are refused rather than coerced.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        "200":
          description: The most recent profiles, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ParticipantProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
  /me:
    get:
      tags: [Identity]
      operationId: getMe
      summary: The current caller
      description: |
        Answers for any signed-in role. An investor who has not completed
        onboarding is reported with `onboarded: false` rather than refused, so a
        client can route them to the profile form instead of treating them as
        unauthorized.
      responses:
        "200":
          description: The caller's identity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identity" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
  /sites:
    post:
      tags: [Sites]
      operationId: createSite
      summary: Save a draft site or submit it immediately
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteCreateRequest" }
      responses:
        "201":
          description: Site created; submitted sites also include the new assessment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteWithMissing" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: Required submission fields or consent are missing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
        "503":
          description:
            Viability service unavailable; no site or assessment is persisted.
            Also returned when the session secret is missing or too short — see
            `AuthUnavailable`. The `code` field distinguishes the two.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /sites/{id}:
    patch:
      tags: [Sites]
      operationId: updateSiteDraft
      summary: Update an owned draft site and refresh missing fields
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteUpdateRequest" }
      responses:
        "200":
          description: Updated draft with recomputed missing fields.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteWithMissing" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
  /sites/{id}/submit:
    post:
      tags: [Sites]
      operationId: submitSite
      summary: Submit or resubmit a site and run viability assessment
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Site moved to submitted with a new assessment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteWithMissing" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: Required submission fields or consent are missing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
        "503":
          description:
            Viability service unavailable; no status or assessment change is
            persisted. Also returned when the session secret is missing or too
            short — see `AuthUnavailable`. The `code` field distinguishes the
            two.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /sites/{id}/documents:
    post:
      tags: [Sites]
      operationId: addSiteDocument
      summary: Record uploaded document metadata for a site
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentCreateRequest" }
      responses:
        "201":
          description: Stored metadata; raw blob_path is never returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /sites/{id}/documents/{documentId}/content:
    put:
      tags: [Sites]
      operationId: putSiteDocumentContent
      summary: Upload the bytes for a document that was already registered
      description: |
        Registration and upload are two steps: `POST /sites/{id}/documents`
        records the metadata, this stores the file.

        The blob location comes from the stored record, never from the request,
        so an uploader cannot choose where its bytes land. The request's
        `Content-Type` is **ignored** in favour of the type validated at
        registration — honouring it would separate what a document claims to be
        from what is served back. The body length must equal the registered
        `size_bytes`, otherwise the record would describe something that is not
        there.

        Site owners may upload to their own sites; operators to any site.
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        description: The raw file bytes. Not base64, and not wrapped in JSON.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Stored. Returns the unchanged metadata; raw blob_path is never returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400":
          description: |
            Empty body, a body larger than the 10 MB cap, or a length that
            disagrees with the registered `size_bytes`. A size mismatch carries
            `expected_size_bytes` and `received_size_bytes` in `details`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
    get:
      tags: [Sites]
      operationId: getSiteDocumentContent
      summary: Download the bytes for a document
      description: |
        Serves the file with the content type held on the record.

        Restricted to the site owner and operators. Investors see tier-1
        document *metadata* through the deal room; content delivery for them is
        the §7.6 short-lived-SAS design and is not implemented.
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: |
            The file. Always `Content-Disposition: attachment` with an RFC 5987
            encoded filename and `X-Content-Type-Options: nosniff`, so an
            uploaded file is never rendered in the origin.
          headers:
            Content-Disposition:
              schema: { type: string }
              description: "`attachment; filename*=UTF-8''<encoded original filename>`"
            X-Content-Type-Options:
              schema: { type: string, enum: [nosniff] }
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: |
            No such document, or the record exists but nothing has been uploaded
            against it yet. The second is a normal state rather than an error —
            it is what an owner's outstanding-items list reads.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
  /me/sites:
    get:
      tags: [Sites]
      operationId: listMySites
      summary: Composed site-owner dashboard
      responses:
        "200":
          description: Only the caller's sites, with latest assessment and project state.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OwnerDashboardItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
  /submissions:
    get:
      tags: [Submissions]
      operationId: listSubmissions
      summary: Operator submission queue; drafts are excluded
      parameters:
        - name: status
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/SubmissionStatus" }
        - name: type
          in: query
          required: false
          schema: { $ref: "#/components/schemas/SiteType" }
        - name: location
          in: query
          required: false
          schema: { type: string }
        - name: viability
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ViabilityStatus" }
      responses:
        "200":
          description: Matching submissions with latest assessments.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SubmissionSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
  /submissions/{id}:
    get:
      tags: [Submissions]
      operationId: getSubmissionDetail
      summary: Operator submission detail
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Site, owner, latest and historical assessments, documents, and activity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmissionDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
  /submissions/{id}/decision:
    post:
      tags: [Submissions]
      operationId: decideSubmission
      summary: Accept, reject, or request information
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmissionDecisionRequest" }
      responses:
        "200":
          description: Decision applied atomically.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmissionDecisionResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: A note is missing for reject or request_info.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
  /pipeline:
    get:
      tags: [Projects]
      operationId: getPipeline
      summary: Operator board across all seven journey stages
      parameters:
        - name: status
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/SubmissionStatus" }
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/SiteType" }
        - name: location
          in: query
          schema: { type: string }
        - name: viability
          in: query
          schema: { $ref: "#/components/schemas/ViabilityStatus" }
      responses:
        "200":
          description: Seven ordered columns using the UI journey-stage ids.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineBoard" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
  /projects/{id}:
    patch:
      tags: [Projects]
      operationId: updateProject
      summary: Update operator assignment, next action, and target date
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectUpdateRequest" }
      responses:
        "200":
          description: Updated project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Assignee is not an operator user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
  /projects/{id}/stage:
    post:
      tags: [Projects]
      operationId: advanceProjectStage
      summary: Advance a project by exactly one stage
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectStageRequest" }
      responses:
        "200":
          description: Updated project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
  /projects/{id}/visibility:
    patch:
      tags: [Projects]
      operationId: updateProjectVisibility
      summary: Set investor visibility
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectVisibilityRequest" }
      responses:
        "200":
          description: Updated project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
  /projects/{id}/engagements:
    get:
      tags: [Engagements]
      operationId: listProjectEngagements
      summary: Operator view of all project engagements
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Project engagements.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Engagement" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
    post:
      tags: [Engagements]
      operationId: expressInterest
      summary: Express non-binding investor interest
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEngagementRequest" }
      responses:
        "201":
          description: Interested engagement created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Engagement" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
  /projects/{id}/funding-needs:
    get:
      tags: [Engagements]
      operationId: listProjectFundingNeeds
      summary: Open funding needs for a visible project
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Open and partially funded needs.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FundingNeed" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
  /projects/{id}/deal-room:
    get:
      tags: [Engagements]
      operationId: getDealRoom
      summary: Tier-1 investor deal room
      description: |
        Returns coarse locality or `Location withheld`, never exact address,
        coordinates, owner identity, or blob paths. The timeline contains shared
        project stage/status events and this investor's own interest event only;
        it excludes other investors' activity and internal free-text notes.
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Viability detail, history, timeline, site characteristics, and non-sensitive documents.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DealRoom" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
  /investors/me/profile:
    get:
      tags: [Portfolio]
      operationId: getMyInvestorProfile
      summary: Read current investor profile
      responses:
        "200":
          description: The current investor's profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvestorProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
    post:
      tags: [Portfolio]
      operationId: upsertMyInvestorProfile
      summary: Complete investor onboarding or update the profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvestorProfileRequest" }
      responses:
        "201":
          description: Profile saved and onboarding_completed_at set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvestorProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: Ticket size range is invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
  /me/engagements:
    get:
      tags: [Engagements]
      operationId: listMyEngagements
      summary: Current investor's own engagement pipeline
      responses:
        "200":
          description:
            Engagements belonging to the signed-in investor. Scoped to the
            caller resolved from the session cookie, not to a fixed account.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EngagementPipelineItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
  /me/outstanding:
    get:
      tags: [Sites]
      operationId: listMyOutstandingItems
      summary: Current owner's outstanding request-info items
      responses:
        "200":
          description: Owner inbox across their sites.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OutstandingItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
  /portfolio:
    get:
      tags: [Portfolio]
      operationId: getPortfolio
      summary: Tier 0 investor portfolio
      parameters:
        - name: mandate_match
          in: query
          schema: { type: boolean, default: true }
        - name: stage
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/ProjectStage" }
        - name: viability
          in: query
          schema: { $ref: "#/components/schemas/ViabilityStatus" }
        - name: project_type
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Visible tier-0 summaries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortfolioResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
  /export:
    get:
      tags: [Export]
      operationId: getExport
      summary: Download the caller's own projects and documents
      description: |
        One endpoint for all three roles. The bundle is assembled from the same
        use-cases the caller's own dashboard reads — `/me/sites` for an owner,
        `/portfolio` plus each `/projects/{id}/deal-room` for an investor,
        `/pipeline` plus each `/submissions/{id}` for an operator — so an
        export can never widen what a role may see.

        Documents are a **manifest, not bytes**. `content_url` points at
        `GET /sites/{id}/documents/{documentId}/content` when the caller has a
        route to that content, and is `null` otherwise. It is always `null` for
        an investor: deal-room content delivery is the §7.6 short-lived-SAS
        design and is not implemented, so offering a link would promise a
        download that answers 403.

        Served as an attachment with `Cache-Control: no-store`, because the
        bundle is scoped to one caller.
      parameters:
        - name: format
          in: query
          description: Defaults to `json`. An unrecognised value is refused rather than silently defaulted.
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        "200":
          description: |
            The export, as a download. The CSV carries the same rows as the
            JSON in two `#`-captioned tables, projects then documents.
          headers:
            Content-Disposition:
              description: "`attachment`, RFC 5987 encoded, e.g. `sunsum-export-site-owner-2026-09-18.json`."
              schema: { type: string }
            Cache-Control:
              description: Always `no-store`.
              schema: { type: string }
            X-Content-Type-Options:
              description: Always `nosniff`.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportBundle" }
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sunsum_session
      description: |
        A signed session cookie issued by `POST /auth/demo-switch`. The token
        names only the user; the role is read from the user record on every
        request, so it cannot be forged or held stale by an old cookie. Expires
        eight hours after it is issued.
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Project identifier (§10 `{id}`).
      schema:
        type: string
        format: uuid
    DocumentId:
      name: documentId
      in: path
      required: true
      description: |
        Document identifier. Scoped by the site in the path — an id belonging to
        another site resolves as `404` rather than leaking that it exists.
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: |
        No session, or one that is expired, unreadable, or signed for a user who
        no longer exists. Always `code: unauthenticated`. Distinct from 403: this
        says the caller is nobody, not that they are the wrong somebody. Sign in
        through `POST /auth/demo-switch` and retry.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CrossSiteRefused:
      description: |
        The request was initiated by another site. `POST /auth/demo-switch` and
        `POST /auth/logout` answer with `Set-Cookie` and take no credential, so
        they refuse a cross-site caller outright — `SameSite=Lax` stops a cookie
        being *sent* cross-site but not one being *set*. Determined from
        `Sec-Fetch-Site`, falling back to `Origin`; a non-browser client that
        sends neither is unaffected. Always `code: forbidden_origin`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AuthUnavailable:
      description: |
        The deployment cannot resolve sessions. Either `SUNSUM_SESSION_SECRET`
        is configured but shorter than 32 characters — refused in every
        environment — or it is unset while running in production. Always
        `code: service_unavailable`. This is a deployment fault, not a caller
        fault: retrying will not clear it.

        Only two kinds of request reach it. A request that *carries* a session
        cookie, because the secret is needed to verify the signature; and
        sign-in, because the secret is needed to mint one. A protected request
        with no cookie is answered `401 unauthenticated` first and never
        observes this condition, so a missing secret presents as "nobody can
        sign in", not as "every endpoint is down".
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Malformed request — bad JSON, unknown enum value, or a missing required field.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        The caller is not allowed. Three codes concern authorization:
        `forbidden_role` (wrong role for the endpoint), `forbidden_owner`
        (right role, but not the owner of this record), and `forbidden_tier`
        (right role, but an insufficient disclosure tier under §7.7 — which is
        also how an investor who has not completed onboarding is refused).

        A fourth code is not about authorization at all. On writes, a request
        that carries a session cookie but originates from another site is
        refused with `code: forbidden_origin` before identity is considered, so
        clients must not read a 403 as a role or ownership failure without
        checking `code`. See `CrossSiteRefused`.

        Compare 401, which means no valid session at all, and 404, which is
        what a project hidden from investors returns rather than a 403.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The requested workflow transition conflicts with current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: |
        No such record — **or** the caller is not entitled to know it exists. Hidden
        projects return 404 rather than 403 to investors, so the endpoint does not
        confirm that an invisible project exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    ExportBundle:
      type: object
      required:
        [
          generated_at,
          role,
          user_id,
          scope,
          project_count,
          document_count,
          projects,
          documents,
        ]
      description: |
        Everything the caller may see, flattened for download. `scope` states in
        prose what the bundle covers for this role, so a file that has been
        detached from the request that produced it still says what it is.
      properties:
        generated_at: { type: string, format: date-time }
        role:
          type: string
          enum: [site_owner, operator, investor]
        user_id: { type: string, format: uuid }
        scope: { type: string }
        project_count: { type: integer }
        document_count: { type: integer }
        projects:
          type: array
          items: { $ref: "#/components/schemas/ExportProjectRow" }
        documents:
          type: array
          items: { $ref: "#/components/schemas/ExportDocumentRow" }
    ExportProjectRow:
      type: object
      required: [name]
      description: |
        One project or submission. Every field but `name` is nullable because
        the three roles see different slices — an investor has no
        `submission_status` and never receives `address` or `site_id`; a
        submission that has not been accepted has no `project_id`.
      properties:
        site_id: { type: string, format: uuid, nullable: true }
        project_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        address: { type: string, nullable: true }
        locality: { type: string, nullable: true }
        site_type: { type: string, nullable: true }
        submission_status: { type: string, nullable: true }
        project_stage: { type: string, nullable: true }
        journey_stage_id: { type: string, nullable: true }
        viability_status: { type: string, nullable: true }
        estimated_system_size_kw_low: { type: number, nullable: true }
        estimated_system_size_kw_high: { type: number, nullable: true }
        estimated_annual_generation_kwh_low: { type: number, nullable: true }
        estimated_annual_generation_kwh_high: { type: number, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    ExportDocumentRow:
      type: object
      required: [id, original_filename]
      description: |
        Document metadata and where to fetch it. Never the bytes: an export that
        embedded content would fail whenever object storage is unreachable.
      properties:
        id: { type: string, format: uuid }
        site_id: { type: string, format: uuid, nullable: true }
        project_id: { type: string, format: uuid, nullable: true }
        original_filename: { type: string }
        content_type: { type: string, nullable: true }
        size_bytes: { type: integer, nullable: true }
        doc_type: { type: string, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
        content_url:
          type: string
          nullable: true
          description: |
            Relative path to `GET /sites/{id}/documents/{documentId}/content`,
            or null when the caller has no route to the content. Always null for
            an investor. Relative because the service is behind a proxy that
            rewrites host and scheme, so it cannot know its own public origin.
    Identity:
      type: object
      required: [user_id, role]
      description: |
        Who the caller is. `onboarded` and `investor` appear only for the
        investor role; `investor` is present only once a profile exists.
      properties:
        user_id: { type: string, format: uuid }
        role:
          type: string
          enum: [site_owner, operator, investor]
        onboarded:
          type: boolean
          description:
            Investor only. False until onboarding is complete — that is, until
            `investor.onboarding_completed_at` is set. A profile can exist with
            a null timestamp, and the investor rules treat that as unfinished,
            so a client should send the caller to the profile form whenever this
            is false rather than testing for the presence of `investor`.
        investor:
          type: object
          required: [id, organization_name, onboarding_completed_at]
          properties:
            id: { type: string, format: uuid }
            organization_name: { type: string }
            onboarding_completed_at:
              type: string
              format: date-time
              nullable: true
    Activity:
      type: object
      required: [id, action, created_at]
      description: Investor-safe project event. Deal-room events omit actor identity and free-text notes.
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        from_value: { type: string, nullable: true }
        to_value: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    CreateEngagementRequest:
      type: object
      additionalProperties: false
      properties:
        funding_need_id:
          type: string
          format: uuid
    DealRoom:
      type: object
      required:
        - project
        - journey_stage_id
        - site
        - assessment_history
        - timeline
        - documents
      properties:
        project: { $ref: "#/components/schemas/Project" }
        journey_stage_id:
          $ref: "#/components/schemas/JourneyStageId"
          description: |
            The charter ribbon literal for `project.stage`, so all three roles
            render the same status ribbon from the same field.
        site:
          type: object
          description: Site characteristics without exact address, coordinates, or owner identity.
          required: [id, locality]
          properties:
            id: { type: string, format: uuid }
            locality:
              type: string
              description: Coarse non-sensitive locality, or `Location withheld`.
            site_type: { $ref: "#/components/schemas/NullableSiteType" }
            ownership_status:
              { $ref: "#/components/schemas/NullableOwnershipStatus" }
            approximate_area_sqm:
              { type: number, format: double, nullable: true, minimum: 0 }
            electricity_usage_kwh_annual:
              { type: number, format: double, nullable: true, minimum: 0 }
            has_existing_solar: { type: boolean, nullable: true }
        assessment:
          allOf:
            - $ref: "#/components/schemas/Assessment"
          description: Investor-safe assessment projection without inputs_used, override_reason, or overridden_by_user_id.
        assessment_history:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Assessment"
            description: Investor-safe assessment projection without inputs_used, override_reason, or overridden_by_user_id.
        timeline:
          type: array
          items: { $ref: "#/components/schemas/Activity" }
        documents:
          type: array
          description: Metadata for documents explicitly classified investor_tier_1 only; never includes blob_path.
          items: { $ref: "#/components/schemas/DealRoomDocument" }
    Engagement:
      type: object
      required:
        - id
        - investor_id
        - project_id
        - state
        - state_changed_at
        - is_binding
        - created_at
      properties:
        id: { type: string, format: uuid }
        investor_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        funding_need_id: { type: string, format: uuid, nullable: true }
        state: { $ref: "#/components/schemas/EngagementState" }
        state_changed_at: { type: string, format: date-time }
        is_binding: { type: boolean }
        created_at: { type: string, format: date-time }
    ProjectStageRequest:
      type: object
      additionalProperties: false
      required: [stage]
      properties:
        stage: { $ref: "#/components/schemas/ProjectStage" }
    ProjectVisibilityRequest:
      type: object
      additionalProperties: false
      required: [visible_to_investors]
      properties:
        visible_to_investors: { type: boolean }
    SubmissionDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [accept, reject, request_info]
          description: request_info moves to info_requested; the owner can resubmit through POST /sites/{id}/submit.
        note: { type: string }
        project_name:
          type: string
          description: Optional non-sensitive investor-facing label. The site address is never used as a fallback.
        assigned_operator_user_id: { type: string, format: uuid }
    SubmissionDecisionResult:
      type: object
      required: [site]
      properties:
        site: { $ref: "#/components/schemas/Site" }
        project: { $ref: "#/components/schemas/Project" }
    Acknowledgement:
      type: object
      description: §5.2 `acknowledgements`.
      required:
        - id
        - project_id
        - user_id
        - agreement_key
        - typed_name
        - acknowledged_at
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        agreement_key:
          type: string
          description: Identifies which agreement was acknowledged.
        typed_name:
          type: string
        acknowledged_at:
          type: string
          format: date-time
        ip_address:
          type: string
          nullable: true
          description: Captured server-side; never accepted from the client.
    Assessment:
      type: object
      description: |
        §5.2 `assessments` — **append-only**; an operator override inserts a new row
        rather than updating. All views read the latest row.
      required:
        - id
        - site_id
        - ruleset_version
        - viability_status
        - is_override
        - created_at
      properties:
        id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
        ruleset_version:
          type: string
          description: §7.3 — displayed to the user alongside the factors used.
        inputs_used:
          type: object
          additionalProperties: true
          description: |
            The exact site facts the ruleset consumed. **OQ-6** — shape owned by WS4;
            not fixed by this contract.
        estimated_system_size_kw_low:
          type: number
          format: double
          nullable: true
        estimated_system_size_kw_high:
          type: number
          format: double
          nullable: true
        estimated_annual_generation_kwh_low:
          type: number
          format: double
          nullable: true
        estimated_annual_generation_kwh_high:
          type: number
          format: double
          nullable: true
        preliminary_project_type:
          type: string
          nullable: true
          description: "**OQ-6** — no enum is given anywhere in the design doc."
        viability_status:
          $ref: "#/components/schemas/ViabilityStatus"
        flags:
          type: array
          items:
            type: string
          description: §7.3 missing-data and risk flags. **OQ-6** — vocabulary owned by WS4.
        missing_information:
          type: array
          items:
            type: string
          description: "**OQ-6** — vocabulary owned by WS4."
        is_override:
          type: boolean
        override_reason:
          type: string
          nullable: true
        overridden_by_user_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
    CreateProjectRequest:
      type: object
      required:
        - site_id
      description: >-
        Accepts the submission for `site_id` and opens a project against it (section 7.5). One
        project per site, so a repeat call returns 409.
      properties:
        site_id:
          type: string
          format: uuid
          description: The submitted site being accepted.
        name:
          type: string
          description: Project name. Defaults to the site label when omitted.
        note:
          type: string
          description: Optional operator note, recorded on the activity log.
        assigned_operator_user_id:
          type: string
          format: uuid
          description: Optionally assign the new project to an internal owner (section 7.5).
    CreateSubmissionRequest:
      type: object
      required:
        - site_id
      description: >-
        Identifies the site being submitted. It must be owned by the caller and be in `draft`
        (sections 6.1, 7.2).
      properties:
        site_id:
          type: string
          format: uuid
          description: The draft site to submit.
    DiligenceItemType:
      type: string
      description: §5.3 `diligence_requests.item_type`.
      enum:
        - document
        - financial
        - technical
        - narrative
        - site_access
    DealRoomDocument:
      type: object
      description: Investor-safe metadata for a document explicitly classified `investor_tier_1`.
      required:
        - id
        - original_filename
        - content_type
        - size_bytes
        - doc_type
        - created_at
      properties:
        id:
          type: string
          format: uuid
        original_filename:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        doc_type:
          type: string
          description: |
            Always present. `documents.doc_type` is `NOT NULL`, and an upload that
            omits one is resolved to `other` before the record is written.
        created_at:
          type: string
          format: date-time
    Document:
      type: object
      description: |
        §5.2 `documents` — metadata only; the file itself lives in Blob Storage.
        `blob_path` is **not** serialised to clients: §7.6 requires a short-lived read
        SAS instead, so a raw container path would be both useless and a disclosure.
      required:
        - id
        - original_filename
        - content_type
        - size_bytes
        - doc_type
        - uploaded_by_user_id
        - created_at
      properties:
        id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
          nullable: true
        project_id:
          type: string
          format: uuid
          nullable: true
        original_filename:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        doc_type:
          type: string
          description: |
            Always present. **OQ-8** — the required-document checklist is
            config-driven (§7.6). `documents.doc_type` is `NOT NULL`, and an
            upload that omits one is resolved to `other` before the record is
            written, so this is never null on a stored document.
        uploaded_by_user_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        download_url:
          type: string
          format: uri
          nullable: true
          description: |
            §7.6 — short-lived read SAS. Regenerated on every read; do not cache or
            persist it. Absent when the caller's tier does not permit the file.
        download_url_expires_at:
          type: string
          format: date-time
          nullable: true
    DocumentCreateRequest:
      type: object
      additionalProperties: false
      required: [original_filename, content_type, size_bytes]
      properties:
        original_filename: { type: string }
        content_type:
          type: string
          enum: [application/pdf, image/jpeg, image/png]
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 10485760
        doc_type:
          type: string
          nullable: true
          default: other
          description: |
            Optional on the request. Omitted or null is stored as `other`; the
            stored document always carries a value. Free text — the list in
            `src/backend/core/documents/storage.ts` keeps the common ones
            (`electricity_bill`, `site_photo`, `site_summary`,
            `screening_report`, `land_report`) spelled the same way across
            workstreams without constraining new ones.
        disclosure_class:
          type: string
          default: owner_private
          enum: [owner_private, investor_tier_1]
    EngagementPipelineItem:
      allOf:
        - $ref: "#/components/schemas/Engagement"
        - type: object
          required: [project_name, project_stage]
          properties:
            project_name: { type: string }
            project_stage: { $ref: "#/components/schemas/ProjectStage" }
    FundingNeed:
      type: object
      required:
        [id, project_id, need_type, stage, description, status, created_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        need_type: { type: string }
        stage: { $ref: "#/components/schemas/FundingStage" }
        description: { type: string }
        amount_requested: { type: number, nullable: true }
        amount_committed: { type: number, nullable: true }
        status:
          type: string
          enum: [open, partially_funded, funded, delivered, cancelled]
        created_at: { type: string, format: date-time }
    FundingStage:
      type: string
      enum: [pre_development, development, construction, permanent]
    EngagementState:
      type: string
      description: |
        §5.3 `investor_engagements.state`. `prospect` is deliberately absent — §6.3:
        "`Prospect` is implicit … The first persisted state is `interested`."
      enum:
        - interested
        - committed
        - underwriting
        - approved
        - funded
        - declined
        - withdrawn
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: |
            Stable, machine-readable. Clients branch on this, never on `message`.

            Authorization codes map to the §8.2 matrix:
            `forbidden_role` (wrong role), `forbidden_owner` (right role, not your
            record), `forbidden_tier` (right role, but an insufficient disclosure
            tier — which includes an investor who has not completed onboarding).

            A project the operator has not made visible to investors answers
            `404 not_found`, not a `403`. That is deliberate: a distinct
            "exists but hidden" code would confirm the project exists to
            exactly the caller who is not allowed to know it.

            `forbidden_origin` is not an authorization decision about the
            caller: it means the request was initiated by another site and was
            refused before any identity was considered.
          example: forbidden_tier
        message:
          type: string
          description: Human-readable. Not intended for client branching.
        details:
          type: object
          additionalProperties: true
          nullable: true
    MissingField:
      type: object
      description: One outstanding item from the §7.2 computed "still missing" list.
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: Property name on `SiteUpdateRequest`, so the client can focus the right input.
        message:
          type: string
    InvestorProfile:
      type: object
      required:
        [
          id,
          user_id,
          organization_name,
          investor_type,
          capital_type,
          funding_stage_focus,
          geographies,
          onboarding_completed_at,
        ]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        organization_name: { type: string }
        investor_type: { $ref: "#/components/schemas/InvestorType" }
        capital_type: { $ref: "#/components/schemas/CapitalType" }
        funding_stage_focus:
          type: array
          items: { $ref: "#/components/schemas/FundingStage" }
        ticket_size_min: { type: number, nullable: true }
        ticket_size_max: { type: number, nullable: true }
        geographies:
          type: array
          items: { type: string }
        investment_objectives:
          type: array
          items: { type: string }
        impact_priorities:
          type: array
          items: { type: string }
        decision_criteria:
          type: array
          items: { type: string }
        deal_room_profile: { type: string }
        visible_portfolio_scope:
          type: array
          items: { type: string }
        onboarding_completed_at:
          { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    InvestorProfileRequest:
      type: object
      additionalProperties: false
      required:
        [
          organization_name,
          investor_type,
          capital_type,
          funding_stage_focus,
          ticket_size_min,
          ticket_size_max,
          geographies,
          investment_objectives,
          impact_priorities,
          decision_criteria,
        ]
      properties:
        organization_name: { type: string }
        investor_type: { $ref: "#/components/schemas/InvestorType" }
        capital_type: { $ref: "#/components/schemas/CapitalType" }
        funding_stage_focus:
          type: array
          items: { $ref: "#/components/schemas/FundingStage" }
        ticket_size_min: { type: number, nullable: true, minimum: 0 }
        ticket_size_max: { type: number, nullable: true, minimum: 0 }
        geographies:
          type: array
          items: { type: string }
        investment_objectives:
          type: array
          items: { type: string }
        impact_priorities:
          type: array
          items: { type: string }
        decision_criteria:
          type: array
          items: { type: string }
    InvestorType:
      type: string
      enum:
        [
          philanthropy,
          impact_investor,
          nmtc,
          cdfi_cde,
          energy_equity_fund,
          corporate,
          special_community_endowment,
        ]
    CapitalType:
      type: string
      enum:
        [
          grant,
          recoverable_grant,
          concessionary_debt,
          senior_debt,
          tax_equity,
          sponsor_equity,
          corporate_offtake,
        ]
    ParticipantProfileRequest:
      type: object
      additionalProperties: false
      description: |
        `additionalProperties: false` is enforced, not decorative: an unknown
        property is a `400`. That is what keeps `password` and `role_id` out —
        the first must never reach the server, the second is derived.
      required:
        [
          full_name,
          email,
          account_method,
          representation,
          user_type_id,
          consent_accepted,
        ]
      properties:
        full_name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        account_method: { $ref: "#/components/schemas/AccountMethod" }
        representation: { $ref: "#/components/schemas/Representation" }
        organisation_name:
          type: string
          nullable: true
          maxLength: 160
          description: |
            Required when `representation` is `organisation`. Ignored and
            stored as `null` for an individual, so the record cannot claim an
            organisation the person did not say they represent.
        user_type_id:
          type: string
          description: |
            One of the user type ids in `src/domain/userTypes.ts`. Validated
            against that list, but stored as text: the taxonomy belongs to the
            sign-up form and grows whenever the charter names a new audience.
        intent_option_ids:
          type: array
          maxItems: 16
          description: |
            Optional. Omitting it means no selections. Duplicates are collapsed.
          items: { type: string }
        consent_accepted:
          type: boolean
          description: |
            Must be `true`. `false` is `422`; absent is `400`. Consent is the
            basis for holding the contact details, so the database refuses a
            row without it as well.
    ParticipantProfile:
      type: object
      additionalProperties: false
      required:
        [
          id,
          full_name,
          email,
          account_method,
          representation,
          organisation_name,
          user_type_id,
          role_id,
          intent_option_ids,
          consent_accepted,
          created_at,
        ]
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string }
        email: { type: string }
        account_method: { $ref: "#/components/schemas/AccountMethod" }
        representation: { $ref: "#/components/schemas/Representation" }
        organisation_name: { type: string, nullable: true }
        user_type_id: { type: string }
        role_id:
          type: string
          nullable: true
          enum: [site-owner, operator, financier, null]
          description: |
            Derived from `user_type_id`, never supplied. `null` when the user
            type maps to no workspace — an answer, not a missing value. Note
            these are the UI charter role ids, hyphenated; the backend wire
            roles used elsewhere in this document are `site_owner`, `operator`
            and `investor`.
        intent_option_ids:
          type: array
          items: { type: string }
        consent_accepted: { type: boolean, enum: [true] }
        created_at: { type: string, format: date-time }
    AccountMethod:
      type: string
      description: |
        How the person said they intend to sign in later. An intention only —
        no credential is accepted or stored by this API.
      enum: [microsoft, google, apple, email]
    Representation:
      type: string
      enum: [individual, organisation]
    JourneyStageId:
      type: string
      description: UI delivery ribbon ids from `src/domain/journey.ts`.
      enum:
        - submitted
        - screening
        - pre-development
        - development
        - construction
        - commissioning
        - operations
    OutstandingItem:
      type: object
      description: |
        §7.4 — "operator `request_info` items and, later, forwarded diligence items
        appear in one list, **never a separate investor surface**."
      required:
        - id
        - source
        - message
        - created_at
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
          description: |
            Where the ask came from. `diligence` items are forwarded **by the
            operator** — the investor who raised them is never identified to the
            owner (§7.8).
          enum:
            - request_info
            - diligence
        site_id:
          type: string
          format: uuid
          nullable: true
        project_id:
          type: string
          format: uuid
          nullable: true
        message:
          type: string
        item_type:
          allOf:
            - $ref: "#/components/schemas/DiligenceItemType"
          description: Present only when `source` is `diligence`.
        due_date:
          type: string
          format: date
          nullable: true
        created_at:
          type: string
          format: date-time
    OwnerDashboardItem:
      type: object
      description: |
        §7.4 — "One composed endpoint returning: site, submission status, viability
        result, outstanding information, documents and acknowledgements, project
        stage, next expected action, contact."
      required:
        - site
        - submission_status
        - project_stage
        - journey_stage_id
        - documents
        - acknowledgements
        - outstanding
      properties:
        site:
          $ref: "#/components/schemas/Site"
        assessment:
          allOf:
            - $ref: "#/components/schemas/Assessment"
          description: The latest row. Absent before submission.
        project:
          allOf:
            - $ref: "#/components/schemas/Project"
          description: Absent until the submission is accepted.
        submission_status:
          $ref: "#/components/schemas/SubmissionStatus"
        project_stage:
          allOf:
            - $ref: "#/components/schemas/ProjectStage"
          nullable: true
          description: Null until the submission is accepted and a project exists.
        journey_stage_id:
          allOf:
            - $ref: "#/components/schemas/JourneyStageId"
          nullable: true
          description: |
            Exact UI ribbon id from `src/domain/journey.ts`; null for off-ribbon
            submission statuses such as `draft`, `info_requested`, `accepted`, and
            `rejected`.
        next_action:
          type: string
          nullable: true
        documents:
          type: array
          items:
            $ref: "#/components/schemas/Document"
        acknowledgements:
          type: array
          items:
            $ref: "#/components/schemas/Acknowledgement"
        outstanding:
          type: array
          description: §7.4 — the owner's single inbox for this site.
          items:
            $ref: "#/components/schemas/OutstandingItem"
        contact:
          allOf:
            - $ref: "#/components/schemas/User"
          description: The assigned operator, once one is set.
    OwnershipStatus:
      type: string
      description: §5.3 `sites.ownership_status`.
      enum:
        - confirmed
        - pending
        - unverified
    NullableOwnershipStatus:
      type: string
      nullable: true
      description: Ownership status once supplied; `null` while a site remains an incomplete draft.
      enum:
        - confirmed
        - pending
        - unverified
    PipelineBoard:
      type: object
      required:
        - columns
      properties:
        columns:
          type: array
          description: Seven columns in UI journey ribbon order.
          items:
            $ref: "#/components/schemas/PipelineColumnData"
    PipelineCard:
      type: object
      description: |
        One card on the board. Carries `site_id` always and `project_id` only once the
        submission has been accepted, because the first two columns are pre-project.
      required:
        - id
        - site_id
        - display_name
        - journey_stage_id
      properties:
        site_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
          nullable: true
        id:
          type: string
          format: uuid
        display_name:
          type: string
        address_raw:
          type: string
          nullable: true
        submission_status:
          $ref: "#/components/schemas/SubmissionStatus"
        project_stage:
          $ref: "#/components/schemas/ProjectStage"
        journey_stage_id:
          $ref: "#/components/schemas/JourneyStageId"
        viability_status:
          $ref: "#/components/schemas/ViabilityStatus"
        site_type:
          $ref: "#/components/schemas/SiteType"
        estimated_capacity_kw:
          type: number
          format: double
          nullable: true
        assigned_operator_user_id:
          type: string
          format: uuid
          nullable: true
        visible_to_investors:
          type: boolean
          nullable: true
        updated_at:
          type: string
          format: date-time
    PipelineColumn:
      type: string
      description: |
        **OQ-2** — the seven columns of the §7.5 / §10 operator board, formed as §6.2
        describes: "the operator's board unions both into one ordered view."

        Two board-visible submission statuses + the five project stages = seven.
        `draft`, `info_requested` and `rejected` are off-board states, reachable
        through `GET /submissions` filters.
      enum:
        - submitted
        - screening
        - pre-development
        - development
        - construction
        - commissioning
        - operations
    PipelineColumnData:
      type: object
      required:
        - journey_stage_id
        - count
        - items
      properties:
        journey_stage_id:
          $ref: "#/components/schemas/JourneyStageId"
        count:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/PipelineCard"
    PortfolioItem:
      type: object
      description: |
        §7.7 **tier 0**: "Neighbourhood location, capacity and production ranges,
        project type, stage, viability. **No exact address, documents or owner
        identity.**"

        This schema deliberately has no `address_raw`, no `latitude`/`longitude`, no
        `owner_user_id` and no documents, so tier 0 cannot leak them by accident.
      required:
        - project_id
        - stage
        - journey_stage_id
        - locality
      properties:
        project_id:
          type: string
          format: uuid
        name:
          type: string
        locality:
          type: string
          description: Neighbourhood-level only — never the exact address.
        stage:
          $ref: "#/components/schemas/ProjectStage"
        journey_stage_id:
          $ref: "#/components/schemas/JourneyStageId"
          description: |
            The charter ribbon literal for `stage`. `stage` is the wire
            vocabulary (`pre_development`); this is the UI's
            (`pre-development`). Render the shared status ribbon from this
            field rather than re-deriving the separator.
        site_type:
          $ref: "#/components/schemas/SiteType"
        preliminary_project_type:
          type: string
          nullable: true
        viability_status:
          $ref: "#/components/schemas/ViabilityStatus"
        estimated_system_size_kw_low:
          type: number
          format: double
          nullable: true
        estimated_system_size_kw_high:
          type: number
          format: double
          nullable: true
        estimated_annual_generation_kwh_low:
          type: number
          format: double
          nullable: true
        estimated_annual_generation_kwh_high:
          type: number
          format: double
          nullable: true
        open_funding_needs_count:
          type: integer
        my_engagement_state:
          allOf:
            - $ref: "#/components/schemas/EngagementState"
          description: The caller's own engagement state, if any. Absent means tier 0.
    PortfolioResponse:
      type: object
      required:
        - items
        - project_count
        - total_estimated_capacity_kw
        - mandate_match
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioItem"
        project_count:
          type: integer
        total_estimated_capacity_kw:
          type: number
          format: double
        mandate_match:
          type: boolean
          description: Whether the mandate filter was applied to this result.
    Project:
      type: object
      description: §5.2 `projects` — created only when a submission is accepted.
      required:
        - id
        - site_id
        - name
        - stage
        - visible_to_investors
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
          description: Unique — one project per site (§5.2).
        name:
          type: string
        assigned_operator_user_id:
          type: string
          format: uuid
          nullable: true
        stage:
          $ref: "#/components/schemas/ProjectStage"
        estimated_capacity_kw:
          type: number
          format: double
          nullable: true
          description: §7.5 — set on accept from the **midpoint** of the latest assessment's size range.
        next_action:
          type: string
          nullable: true
        target_date:
          type: string
          format: date
          nullable: true
        visible_to_investors:
          type: boolean
          default: false
          description: §5.2 / §7.5 — defaults off. Only the operator may change it (§8.2).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProjectStage:
      type: string
      description: §5.3 `projects.stage`. Five values. A project starts at `pre_development`.
      enum:
        - pre_development
        - development
        - construction
        - commissioning
        - operations
    ProjectUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        assigned_operator_user_id:
          type: string
          format: uuid
          nullable: true
        next_action:
          type: string
          nullable: true
        target_date:
          type: string
          format: date
          nullable: true
    Role:
      type: string
      description: §5.3 `users.role`.
      enum:
        - site_owner
        - operator
        - investor
    Site:
      type: object
      description: §5.2 `sites`.
      required:
        - id
        - owner_user_id
        - submission_status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        owner_user_id:
          type: string
          format: uuid
        address_raw:
          type: string
          nullable: true
          description: As typed by the owner, before geocoding.
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        geocode_confidence:
          type: number
          format: double
          nullable: true
          description: Confidence returned by the geocoding provider inside S-VIA (§9.2).
        site_type:
          $ref: "#/components/schemas/NullableSiteType"
        ownership_status:
          $ref: "#/components/schemas/NullableOwnershipStatus"
        approximate_area_sqm:
          type: number
          format: double
          nullable: true
          minimum: 0
          description: |
            Usable area in **square metres**. The unit is fixed by the §5.2 field
            name `approximate_area_sqm` and is not negotiable client-side — a client
            sending square feet will silently produce wrong capacity estimates.
        electricity_usage_kwh_annual:
          type: number
          format: double
          nullable: true
          minimum: 0
          description: Annual consumption in kWh.
        electricity_bill_doc_id:
          type: string
          format: uuid
          nullable: true
          description: References an uploaded `documents.id` (§7.2 "electricity usage or bill upload").
        has_existing_solar:
          type: boolean
          nullable: true
        consent_given_at:
          type: string
          format: date-time
          nullable: true
          description: §7.2 — "Consent is required to submit and stamps `consent_given_at`."
        submission_status:
          $ref: "#/components/schemas/SubmissionStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SiteCreateRequest:
      type: object
      description: |
        Every field is optional so a partial draft can be saved (§7.2). Requirements
        are enforced at submit time, not at create time — unless `submit: true`.
      properties:
        address_raw:
          type: string
        site_type:
          $ref: "#/components/schemas/SiteType"
        ownership_status:
          $ref: "#/components/schemas/OwnershipStatus"
        approximate_area_sqm:
          type: number
          format: double
          minimum: 0
          description: "**Square metres** — see `Site.approximate_area_sqm`."
        electricity_usage_kwh_annual:
          type: number
          format: double
          minimum: 0
        electricity_bill_doc_id:
          type: string
          format: uuid
        has_existing_solar:
          type: boolean
        consent_given:
          type: boolean
          description: Must be `true` to submit. Stamps `consent_given_at` server-side (§7.2).
        submit:
          type: boolean
          default: false
          description: |
            When `true`, validate and submit immediately rather than saving a draft —
            equivalent to `POST /sites` followed by `POST /sites/{siteId}/submit`.
    SiteType:
      type: string
      description: §5.3 `sites.site_type`.
      enum:
        - rooftop
        - land
    NullableSiteType:
      type: string
      nullable: true
      description: Site type once supplied; `null` while a site remains an incomplete draft.
      enum:
        - rooftop
        - land
    SiteUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        address_raw: { type: string, nullable: true }
        site_type: { $ref: "#/components/schemas/NullableSiteType" }
        ownership_status:
          { $ref: "#/components/schemas/NullableOwnershipStatus" }
        approximate_area_sqm: { type: number, nullable: true, minimum: 0 }
        electricity_usage_kwh_annual:
          { type: number, nullable: true, minimum: 0 }
        electricity_bill_doc_id: { type: string, format: uuid, nullable: true }
        has_existing_solar: { type: boolean, nullable: true }
        consent_given: { type: boolean }
    SubmissionDetail:
      type: object
      required:
        [site, assessment, assessment_history, owner, documents, activity]
      properties:
        site: { $ref: "#/components/schemas/Site" }
        assessment: { $ref: "#/components/schemas/Assessment", nullable: true }
        assessment_history:
          type: array
          items: { $ref: "#/components/schemas/Assessment" }
        owner: { $ref: "#/components/schemas/User", nullable: true }
        documents:
          type: array
          items: { $ref: "#/components/schemas/Document" }
        activity:
          type: array
          items: { $ref: "#/components/schemas/OperatorActivity" }
    OperatorActivity:
      type: object
      required: [id, action, actor_user_id, created_at]
      properties:
        id: { type: string, format: uuid }
        site_id: { type: string, format: uuid, nullable: true }
        project_id: { type: string, format: uuid, nullable: true }
        actor_user_id: { type: string, format: uuid }
        action: { type: string }
        note: { type: string, nullable: true }
        from_value: { type: string, nullable: true }
        to_value: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    SiteWithMissing:
      type: object
      required:
        - site
        - missing_fields
      properties:
        site:
          $ref: "#/components/schemas/Site"
        missing_fields:
          type: array
          description: §7.2 — the computed "still missing" list. Empty means the draft can be submitted.
          items:
            $ref: "#/components/schemas/MissingField"
        assessment:
          $ref: "#/components/schemas/Assessment"
    SubmissionStatus:
      type: string
      description: |
        §5.3 `sites.submission_status`.

        **OQ-1** — §5.3 spells the review state `in_review`, but §6.2's table, the
        state diagram and every prose reference spell it `screening` (9 mentions to 1).
        `screening` is used here.

        **OQ-3** — `accepted` is retained: §7.5's accept transaction sets it, even
        though §6.2's board table omits it.
      enum:
        - draft
        - submitted
        - screening
        - info_requested
        - accepted
        - rejected
    SubmissionSummary:
      type: object
      description: §7.5 — "Unconverted sites appear with their assessment attached."
      required:
        - site
      properties:
        site:
          $ref: "#/components/schemas/Site"
        assessment:
          $ref: "#/components/schemas/Assessment"
        owner:
          $ref: "#/components/schemas/User"
    SubmitResult:
      type: object
      required:
        - site
        - assessment
      properties:
        site:
          $ref: "#/components/schemas/Site"
        assessment:
          allOf:
            - $ref: "#/components/schemas/Assessment"
          description: The row just inserted by the S-VIA call.
    User:
      type: object
      description: §5.2 `users`. `password_hash` is never serialised.
      required:
        - id
        - name
        - email
        - role
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        created_at:
          type: string
          format: date-time
    ValidationError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            missing_fields:
              type: array
              items:
                $ref: "#/components/schemas/MissingField"
    ViabilityStatus:
      type: string
      description: §5.3 `assessments.viability_status` — the three §7.3 outcomes.
      enum:
        - potentially_viable
        - more_information_required
        - not_currently_eligible
