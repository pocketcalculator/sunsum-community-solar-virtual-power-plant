openapi: 3.0.3
info:
  title: SunSum API (MVP)
  version: 0.1.0
  description: >-
    Agreed backend contract derived from sections 5-10 of
    `docs/sunsum_technical_design_doc.md`. It covers site draft/submission,
    the site-owner dashboard, the operator queue and decisions, adjacent project
    stage changes, investor visibility, investor interest, operator engagement
    review, the tier-1 deal room, and the existing tier-0 portfolio.

    Wire fields use snake_case. Path parameters identify the resource being acted
    on, request bodies carry mutations, and query parameters filter collections.
    Unknown input is rejected. Optional objects are omitted; nullable scalar values
    use null. The viability engine remains a separate server-to-server service.

    **Demo identity warning:** consistent with PR #10's identity seam, the
    implemented routes do not authenticate the caller. Each route runs as one
    fixed, role-specific demo principal selected by server code. Callers cannot
    select a role or identity through a header, cookie, query parameter, or
    request body. These principals preserve the core authorization paths for the
    demo, but they are not production authentication. Real request-to-viewer
    resolution and CSRF protection for cookie sessions or bearer-token protection
    are future WS3 work and are not implemented here.
  contact:
    name: Workstream 2 — Backend & Workflow
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: /api
    description: Next.js server endpoints (§3 — "Next.js/Node.js server endpoints")
tags:
  - name: Sites
    description: S-SITE — draft save, missing-field computation, submission lifecycle
  - name: Submissions
    description: S-SITE — operator queue and decisions
  - name: Projects
    description: S-PROJ — project creation, stage transitions, assignment, visibility
  - name: Portfolio
    description: S-INV — investor profiles, mandate capture, portfolio matching
  - name: Engagements
    description: S-ENG and S-VIEW — interest, operator review, and deal-room disclosure
paths:
  /sites:
    post:
      tags: [Sites]
      operationId: createSite
      summary: Save a draft site or submit it immediately
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteCreateRequest" }
      responses:
        "201":
          description: Site created; submitted sites also include the new assessment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteWithMissing" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: Required submission fields or consent are missing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
        "503":
          description: Viability service unavailable; no site or assessment is persisted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /me/sites:
    get:
      tags: [Sites]
      operationId: listMySites
      summary: Composed site-owner dashboard
      responses:
        "200":
          description: Only the caller's sites, with latest assessment and project state.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OwnerDashboardItem" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /submissions:
    get:
      tags: [Submissions]
      operationId: listSubmissions
      summary: Operator submission queue; drafts are excluded
      parameters:
        - name: status
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/SubmissionStatus" }
        - name: type
          in: query
          required: false
          schema: { $ref: "#/components/schemas/SiteType" }
        - name: location
          in: query
          required: false
          schema: { type: string }
        - name: viability
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ViabilityStatus" }
      responses:
        "200":
          description: Matching submissions with latest assessments.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SubmissionSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /submissions/{id}/decision:
    post:
      tags: [Submissions]
      operationId: decideSubmission
      summary: Accept, reject, or request information
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmissionDecisionRequest" }
      responses:
        "200":
          description: Decision applied atomically.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmissionDecisionResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: A note is missing for reject or request_info.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
  /projects/{id}/stage:
    post:
      tags: [Projects]
      operationId: advanceProjectStage
      summary: Advance a project by exactly one stage
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectStageRequest" }
      responses:
        "200":
          description: Updated project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{id}/visibility:
    patch:
      tags: [Projects]
      operationId: updateProjectVisibility
      summary: Set investor visibility
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectVisibilityRequest" }
      responses:
        "200":
          description: Updated project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/engagements:
    get:
      tags: [Engagements]
      operationId: listProjectEngagements
      summary: Operator view of all project engagements
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Project engagements.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Engagement" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Engagements]
      operationId: expressInterest
      summary: Express non-binding investor interest
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEngagementRequest" }
      responses:
        "201":
          description: Interested engagement created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Engagement" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{id}/deal-room:
    get:
      tags: [Engagements]
      operationId: getDealRoom
      summary: Tier-1 investor deal room
      description: |
        Returns coarse locality or `Location withheld`, never exact address,
        coordinates, owner identity, or blob paths. The timeline contains shared
        project stage/status events and this investor's own interest event only;
        it excludes other investors' activity and internal free-text notes.
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Viability detail, history, timeline, site characteristics, and non-sensitive documents.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DealRoom" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /portfolio:
    get:
      tags: [Portfolio]
      operationId: getPortfolio
      summary: Tier 0 investor portfolio
      parameters:
        - name: mandate_match
          in: query
          schema: { type: boolean, default: true }
        - name: stage
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/ProjectStage" }
        - name: viability
          in: query
          schema: { $ref: "#/components/schemas/ViabilityStatus" }
        - name: project_type
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Visible tier-0 summaries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortfolioResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Project identifier (§10 `{id}`).
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Malformed request — bad JSON, unknown enum value, or a missing required field.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        The core authorization check rejected the route's fixed demo principal.
        Covers three distinct cases, distinguished by `code`: wrong role for the
        endpoint, right role but not the owner of this record, or right role but
        an insufficient disclosure tier (§7.7). A real authenticated caller is
        future WS3 work and is not implied by this response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The requested workflow transition conflicts with current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: |
        No such record — **or** the caller is not entitled to know it exists. Hidden
        projects return 404 rather than 403 to investors, so the endpoint does not
        confirm that an invisible project exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Activity:
      type: object
      required: [id, action, created_at]
      description: Investor-safe project event. Deal-room events omit actor identity and free-text notes.
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        from_value: { type: string, nullable: true }
        to_value: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    CreateEngagementRequest:
      type: object
      additionalProperties: false
      properties:
        funding_need_id:
          type: string
          format: uuid
    DealRoom:
      type: object
      required:
        - project
        - site
        - assessment_history
        - timeline
        - documents
      properties:
        project: { $ref: "#/components/schemas/Project" }
        site:
          type: object
          description: Site characteristics without exact address, coordinates, or owner identity.
          required: [id, locality]
          properties:
            id: { type: string, format: uuid }
            locality:
              type: string
              description: Coarse non-sensitive locality, or `Location withheld`.
            site_type: { $ref: "#/components/schemas/NullableSiteType" }
            ownership_status: { $ref: "#/components/schemas/NullableOwnershipStatus" }
            approximate_area_sqm: { type: number, format: double, nullable: true, minimum: 0 }
            electricity_usage_kwh_annual: { type: number, format: double, nullable: true, minimum: 0 }
            has_existing_solar: { type: boolean, nullable: true }
        assessment:
          allOf:
            - $ref: "#/components/schemas/Assessment"
          description: Investor-safe assessment projection without inputs_used, override_reason, or overridden_by_user_id.
        assessment_history:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Assessment"
            description: Investor-safe assessment projection without inputs_used, override_reason, or overridden_by_user_id.
        timeline:
          type: array
          items: { $ref: "#/components/schemas/Activity" }
        documents:
          type: array
          description: Metadata for documents explicitly classified investor_tier_1 only; never includes blob_path.
          items: { $ref: "#/components/schemas/DealRoomDocument" }
    Engagement:
      type: object
      required:
        - id
        - investor_id
        - project_id
        - state
        - state_changed_at
        - is_binding
        - created_at
      properties:
        id: { type: string, format: uuid }
        investor_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        funding_need_id: { type: string, format: uuid, nullable: true }
        state: { $ref: "#/components/schemas/EngagementState" }
        state_changed_at: { type: string, format: date-time }
        is_binding: { type: boolean }
        created_at: { type: string, format: date-time }
    ProjectStageRequest:
      type: object
      additionalProperties: false
      required: [stage]
      properties:
        stage: { $ref: "#/components/schemas/ProjectStage" }
    ProjectVisibilityRequest:
      type: object
      additionalProperties: false
      required: [visible_to_investors]
      properties:
        visible_to_investors: { type: boolean }
    SubmissionDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [accept, reject, request_info]
          description: In this scoped implementation, request_info ends at info_requested; owner resubmission is not implemented.
        note: { type: string }
        project_name:
          type: string
          description: Optional non-sensitive investor-facing label. The site address is never used as a fallback.
        assigned_operator_user_id: { type: string, format: uuid }
    SubmissionDecisionResult:
      type: object
      required: [site]
      properties:
        site: { $ref: "#/components/schemas/Site" }
        project: { $ref: "#/components/schemas/Project" }
    Acknowledgement:
      type: object
      description: §5.2 `acknowledgements`.
      required:
        - id
        - project_id
        - user_id
        - agreement_key
        - typed_name
        - acknowledged_at
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        agreement_key:
          type: string
          description: Identifies which agreement was acknowledged.
        typed_name:
          type: string
        acknowledged_at:
          type: string
          format: date-time
        ip_address:
          type: string
          nullable: true
          description: Captured server-side; never accepted from the client.
    Assessment:
      type: object
      description: |
        §5.2 `assessments` — **append-only**; an operator override inserts a new row
        rather than updating. All views read the latest row.
      required:
        - id
        - site_id
        - ruleset_version
        - viability_status
        - is_override
        - created_at
      properties:
        id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
        ruleset_version:
          type: string
          description: §7.3 — displayed to the user alongside the factors used.
        inputs_used:
          type: object
          additionalProperties: true
          description: |
            The exact site facts the ruleset consumed. **OQ-6** — shape owned by WS4;
            not fixed by this contract.
        estimated_system_size_kw_low:
          type: number
          format: double
          nullable: true
        estimated_system_size_kw_high:
          type: number
          format: double
          nullable: true
        estimated_annual_generation_kwh_low:
          type: number
          format: double
          nullable: true
        estimated_annual_generation_kwh_high:
          type: number
          format: double
          nullable: true
        preliminary_project_type:
          type: string
          nullable: true
          description: "**OQ-6** — no enum is given anywhere in the design doc."
        viability_status:
          $ref: "#/components/schemas/ViabilityStatus"
        flags:
          type: array
          items:
            type: string
          description: §7.3 missing-data and risk flags. **OQ-6** — vocabulary owned by WS4.
        missing_information:
          type: array
          items:
            type: string
          description: "**OQ-6** — vocabulary owned by WS4."
        is_override:
          type: boolean
        override_reason:
          type: string
          nullable: true
        overridden_by_user_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
    CreateProjectRequest:
      type: object
      required:
        - site_id
      description: >-
        Accepts the submission for `site_id` and opens a project against it (section 7.5). One
        project per site, so a repeat call returns 409.
      properties:
        site_id:
          type: string
          format: uuid
          description: The submitted site being accepted.
        name:
          type: string
          description: Project name. Defaults to the site label when omitted.
        note:
          type: string
          description: Optional operator note, recorded on the activity log.
        assigned_operator_user_id:
          type: string
          format: uuid
          description: Optionally assign the new project to an internal owner (section 7.5).
    CreateSubmissionRequest:
      type: object
      required:
        - site_id
      description: >-
        Identifies the site being submitted. It must be owned by the caller and be in `draft`
        (sections 6.1, 7.2).
      properties:
        site_id:
          type: string
          format: uuid
          description: The draft site to submit.
    DiligenceItemType:
      type: string
      description: §5.3 `diligence_requests.item_type`.
      enum:
        - document
        - financial
        - technical
        - narrative
        - site_access
    DealRoomDocument:
      type: object
      description: Investor-safe metadata for a document explicitly classified `investor_tier_1`.
      required:
        - id
        - original_filename
        - content_type
        - size_bytes
        - created_at
      properties:
        id:
          type: string
          format: uuid
        original_filename:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        doc_type:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    Document:
      type: object
      description: |
        §5.2 `documents` — metadata only; the file itself lives in Blob Storage.
        `blob_path` is **not** serialised to clients: §7.6 requires a short-lived read
        SAS instead, so a raw container path would be both useless and a disclosure.
      required:
        - id
        - original_filename
        - content_type
        - size_bytes
        - uploaded_by_user_id
        - created_at
      properties:
        id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
          nullable: true
        project_id:
          type: string
          format: uuid
          nullable: true
        original_filename:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        doc_type:
          type: string
          nullable: true
          description: "**OQ-8** — the required-document checklist is config-driven (§7.6)."
        uploaded_by_user_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        download_url:
          type: string
          format: uri
          nullable: true
          description: |
            §7.6 — short-lived read SAS. Regenerated on every read; do not cache or
            persist it. Absent when the caller's tier does not permit the file.
        download_url_expires_at:
          type: string
          format: date-time
          nullable: true
    EngagementState:
      type: string
      description: |
        §5.3 `investor_engagements.state`. `prospect` is deliberately absent — §6.3:
        "`Prospect` is implicit … The first persisted state is `interested`."
      enum:
        - interested
        - committed
        - underwriting
        - approved
        - funded
        - declined
        - withdrawn
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: |
            Stable, machine-readable. Clients branch on this, never on `message`.

            Authorization codes map to the §8.2 matrix:
            `forbidden_role` (wrong role), `forbidden_owner` (right role, not your
            record), `forbidden_tier` (right role, insufficient disclosure tier),
            `forbidden_visibility` (project not investor-visible).
          example: forbidden_tier
        message:
          type: string
          description: Human-readable. Not intended for client branching.
        details:
          type: object
          additionalProperties: true
          nullable: true
    MissingField:
      type: object
      description: One outstanding item from the §7.2 computed "still missing" list.
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: Property name on `SiteUpdateRequest`, so the client can focus the right input.
        message:
          type: string
    OutstandingItem:
      type: object
      description: |
        §7.4 — "operator `request_info` items and, later, forwarded diligence items
        appear in one list, **never a separate investor surface**."
      required:
        - id
        - source
        - message
        - created_at
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
          description: |
            Where the ask came from. `diligence` items are forwarded **by the
            operator** — the investor who raised them is never identified to the
            owner (§7.8).
          enum:
            - request_info
            - diligence
        site_id:
          type: string
          format: uuid
          nullable: true
        project_id:
          type: string
          format: uuid
          nullable: true
        message:
          type: string
        item_type:
          allOf:
            - $ref: "#/components/schemas/DiligenceItemType"
          description: Present only when `source` is `diligence`.
        due_date:
          type: string
          format: date
          nullable: true
        created_at:
          type: string
          format: date-time
    OwnerDashboardItem:
      type: object
      description: |
        §7.4 — "One composed endpoint returning: site, submission status, viability
        result, outstanding information, documents and acknowledgements, project
        stage, next expected action, contact."
      required:
        - site
        - documents
        - acknowledgements
        - outstanding
      properties:
        site:
          $ref: "#/components/schemas/Site"
        assessment:
          allOf:
            - $ref: "#/components/schemas/Assessment"
          description: The latest row. Absent before submission.
        project:
          allOf:
            - $ref: "#/components/schemas/Project"
          description: Absent until the submission is accepted.
        stage:
          allOf:
            - $ref: "#/components/schemas/SharedPipelineState"
          description: |
            **S7** — the single shared value all three roles read. Resolved from the
            project stage once one exists, otherwise from the submission status.
        next_action:
          type: string
          nullable: true
        documents:
          type: array
          items:
            $ref: "#/components/schemas/Document"
        acknowledgements:
          type: array
          items:
            $ref: "#/components/schemas/Acknowledgement"
        outstanding:
          type: array
          description: §7.4 — the owner's single inbox for this site.
          items:
            $ref: "#/components/schemas/OutstandingItem"
        contact:
          allOf:
            - $ref: "#/components/schemas/User"
          description: The assigned operator, once one is set.
    OwnershipStatus:
      type: string
      description: §5.3 `sites.ownership_status`.
      enum:
        - confirmed
        - pending
        - unverified
    NullableOwnershipStatus:
      type: string
      nullable: true
      description: Ownership status once supplied; `null` while a site remains an incomplete draft.
      enum:
        - confirmed
        - pending
        - unverified
    PipelineBoard:
      type: object
      required:
        - columns
        - project_count
        - total_estimated_capacity_kw
      properties:
        columns:
          type: array
          description: Seven columns, in the order of `PipelineColumn` (**OQ-2**).
          items:
            $ref: "#/components/schemas/PipelineColumnData"
        project_count:
          type: integer
          description: §7.5 portfolio summary.
        total_estimated_capacity_kw:
          type: number
          format: double
          description: §7.5 — aggregate estimated capacity.
    PipelineCard:
      type: object
      description: |
        One card on the board. Carries `site_id` always and `project_id` only once the
        submission has been accepted, because the first two columns are pre-project.
      required:
        - site_id
        - title
      properties:
        site_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        viability_status:
          $ref: "#/components/schemas/ViabilityStatus"
        site_type:
          $ref: "#/components/schemas/SiteType"
        estimated_capacity_kw:
          type: number
          format: double
          nullable: true
        assigned_operator_user_id:
          type: string
          format: uuid
          nullable: true
        visible_to_investors:
          type: boolean
          nullable: true
        updated_at:
          type: string
          format: date-time
    PipelineColumn:
      type: string
      description: |
        **OQ-2** — the seven columns of the §7.5 / §10 operator board, formed as §6.2
        describes: "the operator's board unions both into one ordered view."

        Two board-visible submission statuses + the five project stages = seven.
        `draft`, `info_requested` and `rejected` are off-board states, reachable
        through `GET /submissions` filters.
      enum:
        - submitted
        - screening
        - pre_development
        - development
        - construction
        - commissioning
        - operations
    PipelineColumnData:
      type: object
      required:
        - column
        - items
      properties:
        column:
          $ref: "#/components/schemas/PipelineColumn"
        items:
          type: array
          items:
            $ref: "#/components/schemas/PipelineCard"
    PortfolioItem:
      type: object
      description: |
        §7.7 **tier 0**: "Neighbourhood location, capacity and production ranges,
        project type, stage, viability. **No exact address, documents or owner
        identity.**"

        This schema deliberately has no `address_raw`, no `latitude`/`longitude`, no
        `owner_user_id` and no documents, so tier 0 cannot leak them by accident.
      required:
        - project_id
        - stage
        - locality
      properties:
        project_id:
          type: string
          format: uuid
        name:
          type: string
        locality:
          type: string
          description: Neighbourhood-level only — never the exact address.
        stage:
          $ref: "#/components/schemas/ProjectStage"
        site_type:
          $ref: "#/components/schemas/SiteType"
        preliminary_project_type:
          type: string
          nullable: true
        viability_status:
          $ref: "#/components/schemas/ViabilityStatus"
        estimated_system_size_kw_low:
          type: number
          format: double
          nullable: true
        estimated_system_size_kw_high:
          type: number
          format: double
          nullable: true
        estimated_annual_generation_kwh_low:
          type: number
          format: double
          nullable: true
        estimated_annual_generation_kwh_high:
          type: number
          format: double
          nullable: true
        open_funding_needs_count:
          type: integer
        my_engagement_state:
          allOf:
            - $ref: "#/components/schemas/EngagementState"
          description: The caller's own engagement state, if any. Absent means tier 0.
    PortfolioResponse:
      type: object
      required:
        - items
        - project_count
        - total_estimated_capacity_kw
        - mandate_match
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioItem"
        project_count:
          type: integer
        total_estimated_capacity_kw:
          type: number
          format: double
        mandate_match:
          type: boolean
          description: Whether the mandate filter was applied to this result.
    Project:
      type: object
      description: §5.2 `projects` — created only when a submission is accepted.
      required:
        - id
        - site_id
        - name
        - stage
        - visible_to_investors
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
          description: Unique — one project per site (§5.2).
        name:
          type: string
        assigned_operator_user_id:
          type: string
          format: uuid
          nullable: true
        stage:
          $ref: "#/components/schemas/ProjectStage"
        estimated_capacity_kw:
          type: number
          format: double
          nullable: true
          description: §7.5 — set on accept from the **midpoint** of the latest assessment's size range.
        next_action:
          type: string
          nullable: true
        target_date:
          type: string
          format: date
          nullable: true
        visible_to_investors:
          type: boolean
          default: false
          description: §5.2 / §7.5 — defaults off. Only the operator may change it (§8.2).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProjectStage:
      type: string
      description: §5.3 `projects.stage`. Five values. A project starts at `pre_development`.
      enum:
        - pre_development
        - development
        - construction
        - commissioning
        - operations
    ProjectUpdateRequest:
      type: object
      properties:
        name:
          type: string
        assigned_operator_user_id:
          type: string
          format: uuid
          nullable: true
        next_action:
          type: string
          nullable: true
        target_date:
          type: string
          format: date
          nullable: true
    Role:
      type: string
      description: §5.3 `users.role`.
      enum:
        - site_owner
        - operator
        - investor
    Site:
      type: object
      description: §5.2 `sites`.
      required:
        - id
        - owner_user_id
        - submission_status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        owner_user_id:
          type: string
          format: uuid
        address_raw:
          type: string
          nullable: true
          description: As typed by the owner, before geocoding.
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        geocode_confidence:
          type: number
          format: double
          nullable: true
          description: Confidence returned by the geocoding provider inside S-VIA (§9.2).
        site_type:
          $ref: "#/components/schemas/NullableSiteType"
        ownership_status:
          $ref: "#/components/schemas/NullableOwnershipStatus"
        approximate_area_sqm:
          type: number
          format: double
          nullable: true
          minimum: 0
          description: |
            Usable area in **square metres**. The unit is fixed by the §5.2 field
            name `approximate_area_sqm` and is not negotiable client-side — a client
            sending square feet will silently produce wrong capacity estimates.
        electricity_usage_kwh_annual:
          type: number
          format: double
          nullable: true
          minimum: 0
          description: Annual consumption in kWh.
        electricity_bill_doc_id:
          type: string
          format: uuid
          nullable: true
          description: References an uploaded `documents.id` (§7.2 "electricity usage or bill upload").
        has_existing_solar:
          type: boolean
          nullable: true
        consent_given_at:
          type: string
          format: date-time
          nullable: true
          description: §7.2 — "Consent is required to submit and stamps `consent_given_at`."
        submission_status:
          $ref: "#/components/schemas/SubmissionStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SiteCreateRequest:
      type: object
      description: |
        Every field is optional so a partial draft can be saved (§7.2). Requirements
        are enforced at submit time, not at create time — unless `submit: true`.
      properties:
        address_raw:
          type: string
        site_type:
          $ref: "#/components/schemas/SiteType"
        ownership_status:
          $ref: "#/components/schemas/OwnershipStatus"
        approximate_area_sqm:
          type: number
          format: double
          minimum: 0
          description: "**Square metres** — see `Site.approximate_area_sqm`."
        electricity_usage_kwh_annual:
          type: number
          format: double
          minimum: 0
        electricity_bill_doc_id:
          type: string
          format: uuid
        has_existing_solar:
          type: boolean
        consent_given:
          type: boolean
          description: Must be `true` to submit. Stamps `consent_given_at` server-side (§7.2).
        submit:
          type: boolean
          default: false
          description: |
            When `true`, validate and submit immediately rather than saving a draft —
            equivalent to `POST /sites` followed by `POST /sites/{siteId}/submit`.
    SiteType:
      type: string
      description: §5.3 `sites.site_type`.
      enum:
        - rooftop
        - land
    NullableSiteType:
      type: string
      nullable: true
      description: Site type once supplied; `null` while a site remains an incomplete draft.
      enum:
        - rooftop
        - land
    SiteWithMissing:
      type: object
      required:
        - site
        - missing_fields
      properties:
        site:
          $ref: "#/components/schemas/Site"
        missing_fields:
          type: array
          description: §7.2 — the computed "still missing" list. Empty means the draft can be submitted.
          items:
            $ref: "#/components/schemas/MissingField"
        assessment:
          $ref: "#/components/schemas/Assessment"
    SubmissionStatus:
      type: string
      description: |
        §5.3 `sites.submission_status`.

        **OQ-1** — §5.3 spells the review state `in_review`, but §6.2's table, the
        state diagram and every prose reference spell it `screening` (9 mentions to 1).
        `screening` is used here.

        **OQ-3** — `accepted` is retained: §7.5's accept transaction sets it, even
        though §6.2's board table omits it.
      enum:
        - draft
        - submitted
        - screening
        - info_requested
        - accepted
        - rejected
    SharedPipelineState:
      type: string
      description: Submission status before project creation, then project stage after project creation.
      enum:
        - draft
        - submitted
        - screening
        - info_requested
        - rejected
        - pre_development
        - development
        - construction
        - commissioning
        - operations
    SubmissionSummary:
      type: object
      description: §7.5 — "Unconverted sites appear with their assessment attached."
      required:
        - site
      properties:
        site:
          $ref: "#/components/schemas/Site"
        assessment:
          $ref: "#/components/schemas/Assessment"
        owner:
          $ref: "#/components/schemas/User"
    SubmitResult:
      type: object
      required:
        - site
        - assessment
      properties:
        site:
          $ref: "#/components/schemas/Site"
        assessment:
          allOf:
            - $ref: "#/components/schemas/Assessment"
          description: The row just inserted by the S-VIA call.
    User:
      type: object
      description: §5.2 `users`. `password_hash` is never serialised.
      required:
        - id
        - name
        - email
        - role
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        created_at:
          type: string
          format: date-time
    ValidationError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            missing_fields:
              type: array
              items:
                $ref: "#/components/schemas/MissingField"
    ViabilityStatus:
      type: string
      description: §5.3 `assessments.viability_status` — the three §7.3 outcomes.
      enum:
        - potentially_viable
        - more_information_required
        - not_currently_eligible
