[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sunsum-solar"
version = "0.1.0"
description = "Human-reviewed solar site viability screening MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "openai>=1.109,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
  "azure-identity>=1.24,<2",
]

[project.optional-dependencies]
dev = [
  "openpyxl>=3.1,<4",
  "python-docx>=1.2,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
